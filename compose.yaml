name: edge

# What all three Traefik instances share: one image digest and one hardening.
x-traefik: &traefik
  image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The MCP origins' names: traefik-mcp answers to them on mcp-ca (step-ca validates the ACME
# challenge there) and on mcp (the clients). step-ca/ca.json's policy allows exactly this suffix.
x-mcp-origins: &mcp-origins [hello.mcp.internal, songmaker.mcp.internal]

# The agent service's egress (agent-service/egress/): the gateway's one address on the egress
# network, and what a member of the agent networks carries. The service finds the gateway through
# extra_hosts, not through aliases on the gateway, which resolves its upstreams through the same
# Docker DNS and would find itself. The names equal the HostSNI names of
# agent-service/egress/dynamic/allowed.yml.
x-egress-address: &egress-address 172.31.252.10
# The gateway's second address, on the network LiteLLM shares with it: the entrypoint `litellm`
# of agent-service/egress/traefik.yml. LiteLLM finds the provider through extra_hosts too.
x-litellm-egress-address: &litellm-egress-address 172.31.239.10
x-agent-attachments: &agent-attachments
  networks: [agent-songmaker, agent-presentator, agent-hopin, egress, mcp]
  extra_hosts:
    api.anthropic.com: *egress-address
    auth.hallucinai.de: *egress-address

# A one-off container's output belongs to its caller alone: it stays out of the journal.
x-one-off-logging: &one-off-logging {driver: none}

# A bridge that is internal and gets no address of its own on the host: no host listener is
# reachable from it (Engine 28.0+).
x-isolated-bridge: &isolated-bridge
  com.docker.network.bridge.gateway_mode_ipv4: isolated

services:
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?set DOCKER_GID to the host docker group id; `hal apply` writes .env with it}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    # socket-proxy wraps every allow pattern in ^...$ itself; every method without an -allow flag is refused.
    command:
      - "-socketpath=/var/run/docker.sock"
      - "-proxysocketendpoint=/run/socket-proxy/proxy.sock"
      - "-proxysocketendpointfilemode=0600"
      - '-allowGET=/v1\.[0-9]+/(version|events|containers/json|containers/[a-zA-Z0-9_.-]+/json)'
      - "-allowHEAD=/_ping"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The directory, not the socket, is shared: the proxy recreates proxy.sock on every start.
      - socket-proxy-run:/run/socket-proxy

  traefik:
    <<: *traefik
    restart: unless-stopped
    depends_on: [socket-proxy]
    network_mode: host
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:?set EDGE_DOMAIN}
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/dynamic:ro
      - socket-proxy-run:/run/socket-proxy:ro

  hello:
    image: &whoami traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    profiles: [probe]
    networks: [edge-probe]
    labels:
      traefik.enable: "true"
      edge.name: hello
      traefik.http.services.hello.loadbalancer.server.port: "80"


  keycloak-db:
    profiles: [keycloak]
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    # The alpine image's postgres user; the named volume inherits the image's ownership of the data directory.
    user: "70:70"
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets: [keycloak_db_password]
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=keycloak", "--dbname=keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    # No read_only: `start` without --optimized rebuilds the server into the image's lib directory at boot.
    # Keycloak keeps gzip copies of theme files in data/tmp/kc-gzip-cache and never compares them
    # with the file, so the copies must not outlive the process. uid and mode: Docker remounts a
    # bare tmpfs root:root 755 on a restart, and Keycloak (uid 1000) then answers 404 for gzip.
    tmpfs:
      - /opt/keycloak/data/tmp:uid=1000,gid=0,mode=0700,size=64m,nosuid,nodev,noexec
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak, backchannel-songmaker, backchannel-hopin, backchannel-presentator]
    # Secrets reach the process from /run/secrets, never through the container's Config.Env.
    entrypoint: ["/opt/edge/entrypoint.sh", "/opt/keycloak/bin/kc.sh"]
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://auth.${EDGE_DOMAIN:?set EDGE_DOMAIN}
      # The one owner of the admin front end; the apply reads it for master.yaml's frontendUrl.
      KC_HOSTNAME_ADMIN: &admin-hostname http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      # TLS ends at Cloudflare; Traefik forwards plain HTTP from the host side of the keycloak network.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: forwarded
      # The keycloak network's subnet (networks.keycloak below takes it from here).
      KC_PROXY_TRUSTED_ADDRESSES: &keycloak-subnet 172.31.253.0/24
    secrets:
      - source: keycloak_db_password
        target: KC_DB_PASSWORD
    volumes:
      - ./keycloak/entrypoint.sh:/opt/edge/entrypoint.sh:ro
      - ./keycloak/themes/hallucinai:/opt/keycloak/themes/hallucinai:ro
    labels:
      traefik.enable: "true"
      edge.name: auth
      # Traefik reaches Keycloak through the keycloak network only: the back-channel network has no
      # host address, and Keycloak trusts Forwarded from the keycloak network alone.
      traefik.docker.network: ${COMPOSE_PROJECT_NAME}_keycloak
      traefik.http.services.auth.loadbalancer.server.port: "8080"
      # The tunnel reaches only the hallucinai realm, its localization and the static resources
      # under Keycloak's five-character resources version. Any wider /resources/ prefix admits
      # /resources/master/…, the master realm's localization texts.
      traefik.http.routers.auth.entrypoints: edge
      traefik.http.routers.auth.service: auth
      traefik.http.routers.auth.rule: >-
        Host(`auth.${EDGE_DOMAIN}`) && (PathPrefix(`/realms/hallucinai/`)
        || PathPrefix(`/resources/hallucinai/`) || PathRegexp(`^/resources/[a-z0-9]{5}/`))
      # The bare address leads to the account page; every other path outside the realm stays 404.
      traefik.http.routers.auth-root.entrypoints: edge
      # noop@internal: a request the redirect regex does not match must never reach Keycloak.
      traefik.http.routers.auth-root.service: noop@internal
      traefik.http.routers.auth-root.rule: Host(`auth.${EDGE_DOMAIN}`) && Path(`/`)
      traefik.http.routers.auth-root.middlewares: auth-root-to-account
      traefik.http.middlewares.auth-root-to-account.redirectregex.regex: ^.*$$
      traefik.http.middlewares.auth-root-to-account.redirectregex.replacement: https://auth.${EDGE_DOMAIN}/realms/hallucinai/account
      traefik.http.middlewares.auth-root-to-account.redirectregex.permanent: "false"
      # The admin console and the master realm answer on the loopback-only admin entrypoint.
      traefik.http.routers.auth-admin.entrypoints: admin
      traefik.http.routers.auth-admin.service: auth
      traefik.http.routers.auth-admin.rule: Host(`localhost`)

  # The imprint (and the other legal pages) of every app at hallucinai.de: static files from legal/,
  # with appkit's tokens and fonts that the apply step writes into legal/assets/. The catalog gives it the apex as its host; the redirect leaves the served paths to it.
  legal:
    profiles: [legal]
    image: nginxinc/nginx-unprivileged:1.30.6-alpine-slim@sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["nginx", "-g", "daemon off;"]
    networks: [legal]
    volumes:
      # A directory, not a file: git replaces files, so a file bind would keep the old inode.
      - ./legal/nginx:/etc/nginx/conf.d:ro
      - ./legal/built:/srv/pages:ro
      - ./legal/assets:/srv/assets:ro
    labels:
      traefik.enable: "true"
      edge.name: legal
      traefik.http.services.legal.loadbalancer.server.port: "8080"
      traefik.http.routers.legal.entrypoints: edge
      traefik.http.routers.legal.service: legal
      traefik.http.routers.legal.rule: Host(`${EDGE_DOMAIN}`)

  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
    profiles: [apply]
    logging: *one-off-logging
    depends_on: [keycloak]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    entrypoint: ["/opt/edge/entrypoint.sh", "java", "-jar", "/app/keycloak-config-cli.jar"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      KEYCLOAK_GRANTTYPE: client_credentials
      KEYCLOAK_CLIENTID: config-cli
      IMPORT_FILES_LOCATIONS: file:/config/master.yaml,file:/config/realm.yaml
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
      # The apply adds and changes and deletes no undeclared top-level object and no person: every
      # managed type is no-delete, so an object only Keycloak has stays, and a listed user keeps the
      # realm roles and groups the console gave.
      # The cache would skip an unchanged realm file silently.
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_USERS_MERGEROLES: "true"
      IMPORT_USERS_MERGEGROUPS: "true"
      IMPORT_MANAGED_AUTHENTICATIONFLOW: no-delete
      IMPORT_MANAGED_GROUP: no-delete
      IMPORT_MANAGED_SUBGROUP: no-delete
      IMPORT_MANAGED_REQUIREDACTION: no-delete
      IMPORT_MANAGED_CLIENTSCOPE: no-delete
      IMPORT_MANAGED_SCOPEMAPPING: no-delete
      IMPORT_MANAGED_CLIENTSCOPEMAPPING: no-delete
      IMPORT_MANAGED_COMPONENT: no-delete
      IMPORT_MANAGED_SUBCOMPONENT: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDER: no-delete
      IMPORT_MANAGED_IDENTITYPROVIDERMAPPER: no-delete
      IMPORT_MANAGED_ROLE: no-delete
      IMPORT_MANAGED_CLIENT: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONRESOURCES: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONPOLICIES: no-delete
      IMPORT_MANAGED_CLIENTAUTHORIZATIONSCOPES: no-delete
      IMPORT_MANAGED_MESSAGEBUNDLES: no-delete
      IMPORT_MANAGED_ORGANIZATION: no-delete
      IMPORT_MANAGED_WORKFLOW: no-delete
      KC_HOSTNAME_ADMIN: *admin-hostname
    secrets:
      - source: keycloak_config_cli_secret
        target: KEYCLOAK_CLIENTSECRET
      - source: keycloak_config_cli_secret
        target: CONFIG_CLI_CLIENT_SECRET
      - source: keycloak_client_songmaker
        target: SONGMAKER_CLIENT_SECRET
      - source: keycloak_client_hopin
        target: HOPIN_CLIENT_SECRET
      - source: keycloak_client_presentator
        target: PRESENTATOR_CLIENT_SECRET
    volumes:
      - ./keycloak/entrypoint.sh:/opt/edge/entrypoint.sh:ro
      - ./keycloak:/config:ro

  # Reads both realms through the admin API, GET only, and prints one JSON inventory
  # (src/hal/stack/realm/observe.py). No depends_on: an observe never starts Keycloak. Run it as
  # `compose run -T --rm --no-deps realm-observer` with the per-run digest key on stdin, or with
  # `--import-checksums` after it, which needs no key and prints config-cli's import checksums.
  realm-observer:
    # The probe's python pin (probe/keycloak/compose.probe.yaml); ci.yml checks the two are equal.
    # agent-probe below carries the same pin; Dependabot moves all of them in one pull.
    image: python:3.13.17-alpine@sha256:fa0bb0d0cd7c7d6cef30a69094d32ac2b71c7304c87c6107fec100e1ee4eda02
    profiles: [apply]
    logging: *one-off-logging
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    # -I ignores the PYTHON* environment, so -B is what keeps bytecode unwritten.
    entrypoint:
      - python
      - -I
      - -B
      - /opt/observer/observe.py
      - --base-url
      - http://keycloak:8080
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - source: keycloak_config_cli_secret
        target: config_cli_secret
    volumes:
      - ./src/hal/stack/realm/observe.py:/opt/observer/observe.py:ro

  step-ca:
    profiles: [step-ca]
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    restart: unless-stopped
    # The image's own user; step-ca/init makes the volume's files for it.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    # The image's step-ca binary carries a file capability for low ports; without it in the
    # bounding set the kernel refuses to exec it (verified on 0.30.2). The CA itself listens on 9000.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Only the internal network: no route out, no published port. traefik-mcp joins it.
    networks: [mcp-ca]
    # Not the image's entrypoint: its init path would print an admin password into the log.
    entrypoint: ["/usr/local/bin/step-ca"]
    command:
      - "--password-file=/run/secrets/step_ca_password"
      - "/etc/step-ca/ca.json"
    secrets: [step_ca_password]
    volumes:
      - ./step-ca/ca.json:/etc/step-ca/ca.json:ro
      # Intermediate certificate and key, the root certificate and the db; never the root key.
      - step-ca:/home/step
    # The image's own check lacks --ca-url and always fails. Reads only the public root certificate.
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://step-ca:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Gives the ACME volume to uid 65534: a new named volume belongs to root, and traefik-mcp is
  # read_only and not root.
  traefik-mcp-acme-owner:
    <<: *traefik
    profiles: [step-ca]
    user: "0:0"
    cap_add: [CHOWN]
    restart: "no"
    network_mode: none
    entrypoint: ["chown", "65534:65534", "/acme"]
    volumes:
      - traefik-mcp-acme:/acme

  # The second Traefik: the one gateway between the agent service and the MCP servers. No host
  # networking, no Docker API; the only container on all MCP networks.
  traefik-mcp:
    <<: *traefik
    profiles: [step-ca]
    restart: unless-stopped
    # Traefik asks the CA once when it starts and does not ask again if the CA was not there; with
    # an empty ACME storage nothing is left to renew. service_started does not wait for the CA and
    # the daemon starts containers unordered after its own restart, so the wait is here. With a
    # stored certificate it starts at once and renews later.
    entrypoint:
      - sh
      - -c
      - |
        trap 'exit 143' TERM
        grep -qs '"certificate"' /acme/acme.json || {
          echo 'traefik-mcp: waiting for step-ca:9000' >&2
          until nc -z step-ca 9000; do sleep 1; done
        }
        exec traefik
    depends_on:
      step-ca: {condition: service_started}
      traefik-mcp-acme-owner: {condition: service_completed_successfully}
    # The entrypoint listens on 443 as uid 65534.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      mcp-ca: {aliases: *mcp-origins}
      mcp: {aliases: *mcp-origins}
      mcp-backends: {}
      mcp-songmaker: {}
    secrets: [step_ca_root_certificate]
    volumes:
      - ./traefik-mcp.yml:/etc/traefik/traefik.yml:ro
      - ./mcp/dynamic:/mcp/dynamic:ro
      # Issued certificates; not backed up, they are issued again.
      - traefik-mcp-acme:/acme

  # The probe's MCP server behind traefik-mcp (mcp/dynamic/hello.yml); plain HTTP, mcp-backends only.
  hello-mcp:
    image: *whoami
    profiles: [probe]
    networks: [mcp-backends]

  # The agent service's egress: a third Traefik instance, a TLS passthrough that dials only the
  # upstream of an allowed SNI (agent-service/egress/dynamic/allowed.yml). The only service on
  # `internet`. The unit `agent-service` of fleet.yaml starts it with the service.
  agent-egress:
    <<: *traefik
    profiles: [agent-service]
    restart: unless-stopped
    # The entrypoint listens on 443 as uid 65534.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      egress: {ipv4_address: *egress-address}
      litellm-egress: {ipv4_address: *litellm-egress-address}
      internet: {}
    volumes:
      - ./agent-service/egress/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./agent-service/egress/dynamic:/egress/dynamic:ro

  # The one-route front of LiteLLM (agent-service/litellm/front/): the agent service's only way to
  # the inference gateway. It reads no secret and reaches only `litellm`. Not started by any
  # unit yet.
  litellm-front:
    <<: *traefik
    profiles: [litellm]
    restart: unless-stopped
    networks: [litellm-api, litellm-backend]
    volumes:
      - ./agent-service/litellm/front/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./agent-service/litellm/front/dynamic:/litellm-front/dynamic:ro

  # LiteLLM, the agent service's route to the paid API (agent-service/litellm/). It reads the
  # provider key and the service credential as files, holds no database and reaches only the
  # front and, through agent-egress, the provider. A change of its files reaches it only through
  # a recreate. Not started by any unit yet.
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    profiles: [litellm]
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    networks: [litellm-backend, litellm-egress]
    extra_hosts:
      api.anthropic.com: *litellm-egress-address
    environment:
      HOME: /tmp
      PYTHONPATH: /etc/litellm
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_TELEMETRY: "False"
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=64m,nosuid,nodev
    secrets: [litellm_anthropic_key, litellm_master_key, agent_service_api_credential]
    entrypoint:
      - /etc/litellm/start.sh
      - /run/secrets/litellm_anthropic_key
      - /run/secrets/litellm_master_key
    volumes:
      - ./agent-service/litellm/config.yaml:/etc/litellm/config.yaml:ro
      - ./agent-service/litellm/auth.py:/etc/litellm/auth.py:ro
      - ./agent-service/litellm/gate.py:/etc/litellm/gate.py:ro
      - ./agent-service/litellm/start.sh:/etc/litellm/start.sh:ro

  # The agent service (the image is built on the PC, docs/agent-service.md,
  # "The image"). One worker, one replica. It runs as 1000:1000 because its reader refuses a
  # login file that group or others can touch, so the container user must own the login directory
  # (docs/agent-service.md, "The login"). The unit `agent-service` of fleet.yaml starts it.
  agent-service:
    <<: *agent-attachments
    networks: [agent-songmaker, agent-presentator, agent-hopin, egress, mcp, litellm-api]
    image: &agent-service-image edge-agent-service:0.12.0-claude-2.1.302-codex-0.163.0
    pull_policy: never
    profiles: [agent-service]
    user: "1000:1000"
    init: true
    restart: unless-stopped
    # A stop waits for the open requests, then for a Codex login renewal in flight (about 45 s at
    # most), and agent-runtime's migration notes ask for at least 60 s beyond that. A kill sooner
    # can leave `.<file>.new` beside the login file.
    stop_grace_period: 105s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    environment:
      HOME: /tmp
    # The service owns its working root and refuses to start unless the root is owned by its user
    # with mode 0700.
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,size=16m,nosuid,nodev,noexec
      - /run/agent-service/cli:uid=1000,gid=1000,mode=0700,size=256m,nosuid,nodev,noexec
    # The signing key and the CA root the service trusts for MCP origins; a missing source stops
    # the start. Kept off the anchor, so agent-probe gets no key.
    secrets: [agent_service_signing_key, step_ca_root_certificate]
    volumes:
      - type: bind
        source: ./agent-service/service.toml
        target: /etc/agent-service/service.toml
        read_only: true
        bind:
          create_host_path: false
      # A directory, never the token file: the file is replaced inside it (`mv -T token.new token`)
      # and a file bind would keep the old inode. A missing directory fails the start; it is never
      # created as root's.
      - type: bind
        source: ${HOME}/.secrets/agent-service/claude
        target: /run/agent-service/login/claude
        read_only: true
        bind:
          create_host_path: false
      # The same for the Codex login: the dedicated folder `codex login` wrote its `auth.json`
      # into, never the operator's ~/.codex. The one writable bind: the service renews the login
      # itself, writing `.auth.json.new` beside the file and renaming it over, so it needs the
      # directory read-write; a read-only directory renews nothing.
      - type: bind
        source: ${HOME}/.secrets/agent-service/codex
        target: /run/agent-service/login/codex
        bind:
          create_host_path: false

  # The operator's smoke of the agent service (agent-service/smoke.py; docs/agent-service.md,
  # "Proofs"): the service image, one run, the answer printed. Run it as
  # `compose run -T --rm agent-smoke [--cancel]` with the person's and the workload's token on
  # stdin, one per line. No depends_on: a run never starts the service. On `agent-songmaker` alone and with
  # no secret, port or published address: the tokens come in on stdin and never leave in output.
  agent-smoke:
    image: *agent-service-image
    pull_policy: never
    profiles: [apply]
    logging: *one-off-logging
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [agent-songmaker]
    # -I ignores the PYTHON* environment, so -B is what keeps bytecode unwritten.
    entrypoint:
      - python
      - -I
      - -B
      - /opt/smoke/smoke.py
    volumes:
      - ./agent-service/smoke.py:/opt/smoke/smoke.py:ro

  # The probe's stand-in for the agent service (probe/agent-service/egress.py): the same
  # attachments, hardened like the service, listening on nothing.
  agent-probe:
    <<: *agent-attachments
    image: python:3.13.17-alpine@sha256:fa0bb0d0cd7c7d6cef30a69094d32ac2b71c7304c87c6107fec100e1ee4eda02
    profiles: [agent-probe]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    command: ["sleep", "infinity"]

volumes:
  socket-proxy-run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=65534,gid=65534,mode=0700"
  keycloak-db:
  step-ca:
  traefik-mcp-acme:

secrets:
  # Files only, outside the repository; docs/keycloak.md, "Secrets", names how they are made.
  keycloak_db_password:
    file: ${HOME}/.secrets/keycloak/db-password
  keycloak_config_cli_secret:
    file: ${HOME}/.secrets/keycloak/config-cli-secret
  keycloak_client_songmaker:
    file: ${HOME}/.secrets/keycloak/clients/songmaker
  keycloak_client_hopin:
    file: ${HOME}/.secrets/keycloak/clients/hopin
  keycloak_client_presentator:
    file: ${HOME}/.secrets/keycloak/clients/presentator
  # step-ca/init creates it; docs/internal-ca.md.
  step_ca_password:
    file: ${HOME}/.secrets/step-ca/password
  # The same init makes it; traefik-mcp and the agent service trust the CA through it.
  step_ca_root_certificate:
    file: ${HOME}/.secrets/step-ca/root_ca.crt
  # agent-service/setup makes it; only the private file reaches the service, never its folder.
  agent_service_signing_key:
    file: ${HOME}/.secrets/agent-service/signing/private.pem
  # LiteLLM refuses to boot without a master key; this one is generated, read by litellm alone
  # and known to no client, so its admin routes stay closed.
  litellm_master_key:
    file: ${HOME}/.secrets/litellm/master-key
  # The provider key, read by litellm alone, and the service credential (JSON with `shared_key`),
  # read by litellm and, once the service has an [api] table, by agent-service.
  litellm_anthropic_key:
    file: ${HOME}/.secrets/litellm/anthropic
  agent_service_api_credential:
    file: ${HOME}/.secrets/agent-service/api/credential.json

networks:
  edge-probe:
    driver: bridge
  # step-ca's own network: internal, so it has no route to the internet or other networks (Docker
  # still lets its containers reach host services through the gateway address).
  mcp-ca:
    internal: true
  # The agent service and traefik-mcp; the clients never see step-ca or the backends. Isolated
  # before the service joins, so no live network has to be created again.
  mcp:
    internal: true
    driver_opts: *isolated-bridge
  # traefik-mcp and the apps' MCP servers.
  mcp-backends:
    internal: true
  # songmaker's MCP server and traefik-mcp alone (mcp/dynamic/songmaker.yml); the app joins it as an
  # external network. The fixed name survives the project's rename to `hal`.
  mcp-songmaker:
    name: hal_mcp_songmaker
    internal: true
    driver_opts: *isolated-bridge
  # One app's callers and the agent service; each app joins its own network as an external network,
  # so no app sees another's.
  agent-songmaker:
    name: hal_agent_songmaker
    internal: true
    driver_opts: *isolated-bridge
  agent-presentator:
    name: hal_agent_presentator
    internal: true
    driver_opts: *isolated-bridge
  agent-hopin:
    name: hal_agent_hopin
    internal: true
    driver_opts: *isolated-bridge
  # Keycloak's back-channel logout call to songmaker, which joins it as an external network with the
  # alias songmaker.hallucinai.de.
  # One network per app, so no app sees another's. The fixed name survives the project's rename to `hal`.
  backchannel-songmaker:
    name: hal_backchannel_songmaker
    internal: true
    driver_opts: *isolated-bridge
  # The same for HopIn, whose alias is hopin.hallucinai.de.
  backchannel-hopin:
    name: hal_backchannel_hopin
    internal: true
    driver_opts: *isolated-bridge
  # The same for presentator, whose alias is presentator.hallucinai.de and whose port is 8000.
  backchannel-presentator:
    name: hal_backchannel_presentator
    internal: true
    driver_opts: *isolated-bridge
  # The agent service and agent-egress, the only way out of the service.
  egress:
    internal: true
    driver_opts: *isolated-bridge
    ipam:
      config:
        # Pinned so agent-egress has one address; the probe overlay takes its own free subnet.
        - subnet: 172.31.252.0/24
  # The agent service and the front of LiteLLM, which is its only member besides the service.
  litellm-api:
    internal: true
    driver_opts: *isolated-bridge
  # The front and LiteLLM.
  litellm-backend:
    internal: true
    driver_opts: *isolated-bridge
  # LiteLLM and agent-egress's second entrypoint, the only way out of LiteLLM.
  litellm-egress:
    internal: true
    driver_opts: *isolated-bridge
    ipam:
      config:
        # Pinned so agent-egress has one address on it; the probe moves it to a free /24.
        - subnet: 172.31.239.0/24
  # agent-egress alone: a plain NAT bridge, the one route to the internet.
  internet:
    driver: bridge
  # The legal unit's own network: internal, so nginx has no route out; Traefik reaches it from the host.
  legal:
    internal: true
  keycloak:
    driver: bridge
    ipam:
      config:
        # Pinned so KC_PROXY_TRUSTED_ADDRESSES names exactly the network Traefik reaches Keycloak through.
        - subnet: *keycloak-subnet
