# The overlay of the CI job `front` (tests/test_litellm_front.py), laid over compose.yaml: the
# shipped litellm-front with a stand-in for LiteLLM on its backend network and a client on its api
# network. Both images are read from compose.yaml's pins by the test. Never used live. The front
# keeps only its own two networks, so a local run never joins the fixed-name app networks, and finds
# the stand-in by its alias: no extra_hosts, and no pinned subnet that a live network could hold.
# Those three replacements need compose's `!override` and `!reset` tags, which the repository's YAML
# checks cannot read: the test writes them into a third overlay at run time.
services:
  stand-in:
    image: ${STAND_IN_IMAGE:?run through tests/test_litellm_front.py}
    networks:
      litellm-backend:
        aliases: [litellm]
    command: ["--port", "4000"]

  client:
    image: ${CLIENT_IMAGE:?run through tests/test_litellm_front.py}
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [litellm-api]
    command: ["sleep", "infinity"]
