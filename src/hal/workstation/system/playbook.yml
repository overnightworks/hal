# The system step of `hal setup`: edge's cloudflared unit, its three drop-ins and the stop-only polkit
# rule, and the daily timer that deletes journal entries before they are 30 days old.
#
# hal.workstation.system_step runs it as root under one `sudo`, which asks once, and passes `home`,
# `operator_user`, `edge_tunnel_dir` and `journal_vacuum_days` as extra vars from home's Layout and
# the running user, and the agents' account name as `agent_user`; nothing here is taken from facts gathered as root. It never starts, stops or
# restarts cloudflared. Every run of `hal setup` reloads systemd; `--dry-run` does not. An extra reload at the end
# follows only when an edge file or the retired drop-in changed. What it replaces of edge's files is
# copied to `backup_dir` first, outside /etc/systemd/system, so systemd never loads a backup as a unit
# or a drop-in; the retention units and rsyslog's conffiles are home's own and are not backed up.
#
# It purges rsyslog (the journal is the one log store) and then deletes its six files, `rsyslog_file_names`, with their
# rotations, without a copy; the purge comes first so a running rsyslog cannot recreate one, and both follow the refusals.
# Both are by state, so a run interrupted between them is finished by the next. A revert of this play, then
# `apt install rsyslog`, puts the package back; the deleted lines stay gone, and a purge discards a conffile of
# rsyslog that was modified.
#
# It merges `"log-driver": "journald"` into /etc/docker/daemon.json (every other key stays; the file is checked with
# `dockerd --validate` and, when it changes, backed up with edge's files) and restarts Docker while `docker info` does
# not say `docker_log_driver`: with live-restore off, every container stops meanwhile and one without a restart policy
# stays down. A malformed file, a `log-opts` key, another `log-driver` or a Docker that does not answer is refused before
# anything is written. When the restart fails or Docker does not say journald, the file is written back without
# `log-driver` and Docker restarted again; that is the last task, so edge's other files are already in place.
#
# It also installs msmtp and ca-certificates (never msmtp-mta) once the refusals above passed, for the mail of `hal check`.
#
# The agents' account is dormant: nothing runs as it until a door exists. It has its own group only, a locked
# password, the shell nologin, a 0700 home, no subuid or subgid range, no linger, and a line in /etc/cron.deny
# (every other user keeps today's cron; an existing cron.allow decides alone and must not list it). Its uid and gid
# are one regular id from 1000 up, so that its logs go to a journal of its own. An account of that name in any other
# shape (a uid or gid it shares, a group of that name without it), or an id with a subordinate id entry, is refused
# before anything is written. A revert of this play keeps the user and its home.
- name: Install edge's cloudflared files, the stop-only polkit rule and the journal retention timer
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tunnel_config: /etc/cloudflared/config.yml
    unit_dir: /etc/systemd/system
    drop_in_dir: "{{ unit_dir }}/cloudflared.service.d"
    retired_drop_in: "{{ drop_in_dir }}/10-root-binary.conf"
    backup_dir: /var/backups/home-setup
    agent_home: "/home/{{ agent_user }}"
    agent_nologin: /usr/sbin/nologin
    cron_deny: /etc/cron.deny
    docker_config_path: /etc/docker/daemon.json
    retention_units:
      - dest: "{{ unit_dir }}/hal-journal-retention.service"
        content: |
          [Unit]
          Description=Delete old journal entries

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/journalctl --rotate --vacuum-time={{ journal_vacuum_days }}d
      - dest: "{{ unit_dir }}/hal-journal-retention.timer"
        content: |
          [Unit]
          Description=Delete old journal entries daily, and after an outage

          [Timer]
          OnCalendar=daily
          Persistent=true

          [Install]
          WantedBy=timers.target
    # The base unit comes first, so the retired drop-in is only deleted once the unit that replaces it is in place.
    system_files:
      - { src: cloudflared.service, dest: "{{ unit_dir }}/cloudflared.service" }
      - { src: cloudflared.service.d/20-nonroot.conf, dest: "{{ drop_in_dir }}/20-nonroot.conf" }
      - { src: cloudflared.service.d/30-edge-global-stop.conf, dest: "{{ drop_in_dir }}/30-edge-global-stop.conf" }
      - { src: cloudflared.service.d/30-hal-global-stop.conf, dest: "{{ drop_in_dir }}/30-hal-global-stop.conf" }
      - { src: polkit/10-edge-cloudflared-stop.rules, dest: /etc/polkit-1/rules.d/10-edge-cloudflared-stop.rules }
      - { src: polkit/10-hal-cloudflared-stop.rules, dest: /etc/polkit-1/rules.d/10-hal-cloudflared-stop.rules }

  tasks:
    - name: Read cloudflared's config for the tunnel id
      ansible.builtin.slurp:
        src: "{{ tunnel_config }}"
      register: tunnel_config_file

    # `default('', true)` also replaces an empty `tunnel:`, which YAML reads as null and `string` would make "None".
    - name: Take the tunnel id and this run's backup name
      ansible.builtin.set_fact:
        tunnel_id: "{{ ((tunnel_config_file.content | b64decode | from_yaml) or {}).tunnel | default('', true) | string }}"
        run_stamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

    - name: Refuse before writing anything when the config names no tunnel
      ansible.builtin.assert:
        that: tunnel_id | length > 0
        fail_msg: "{{ tunnel_config }} names no `tunnel:`; nothing was written"
        quiet: true

    - name: List every user and group of this PC
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group]
      register: every_entry
      check_mode: false

    - name: Look at the agents' account
      ansible.builtin.getent:
        database: "{{ item }}"
        key: "{{ agent_user }}"
        fail_key: false
      loop: [passwd, shadow]
      register: agent_entry

    - name: Note whether the agents' account exists, and which ids and group names are taken
      ansible.builtin.set_fact:
        agent_account: "{{ agent_entry.results[0].ansible_facts.getent_passwd[agent_user] }}"
        agent_exists: "{{ agent_entry.results[0].ansible_facts.getent_passwd[agent_user] is not none }}"
        every_user: "{{ every_entry.results[0].ansible_facts.getent_passwd }}"
        every_group: "{{ every_entry.results[1].ansible_facts.getent_group }}"
        agent_taken_ids: >-
          {{ every_entry.results[0].ansible_facts.getent_passwd.values() | map(attribute=1) | map('int') | list
             + every_entry.results[1].ansible_facts.getent_group.values() | map(attribute=1) | map('int') | list }}

    - name: Look at the subordinate id files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/subuid, /etc/subgid]
      register: subid_files

    # Both files key an entry on the owner's name or uid, and a granted range is never the agents' to have.
    - name: Read who owns a subordinate id range
      ansible.builtin.command:
        argv: [cut, "--delimiter=:", --fields=1, "{{ item.item }}"]
      loop: "{{ subid_files.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"
      register: subid_owners_read
      changed_when: false
      check_mode: false

    - name: Note the owners of the subordinate id ranges
      ansible.builtin.set_fact:
        subid_owners: "{{ subid_owners_read.results | map(attribute='stdout_lines') | flatten }}"

    # The lowest regular id from 1000 up that no user or group has and no subordinate id range names, one number
    # for uid and gid: the group is created with it first, then the user with it as uid and that group as primary.
    - name: Fix the uid and gid of the agents' account
      ansible.builtin.set_fact:
        agent_uid: >-
          {{ agent_account[1] | int if agent_exists
             else (range(1000, 60000) | reject('in', agent_taken_ids)
                   | reject('in', subid_owners | select('match', '^[0-9]+$') | map('int') | list) | first) }}
        agent_gid: >-
          {{ agent_account[2] | int if agent_exists
             else (range(1000, 60000) | reject('in', agent_taken_ids)
                   | reject('in', subid_owners | select('match', '^[0-9]+$') | map('int') | list) | first) }}

    - name: Name the users and groups that share an id of the agents' account
      ansible.builtin.set_fact:
        agent_uid_sharers: "{{ every_user | dict2items | selectattr('value.1', 'equalto', agent_uid | string) | map(attribute='key') | list }}"
        agent_gid_sharers: >-
          {{ every_group | dict2items | selectattr('value.1', 'equalto', agent_gid | string)
             | map(attribute='key') | reject('equalto', agent_user) | list }}

    - name: Read the groups of the agents' account
      ansible.builtin.command:
        argv: [id, --groups, --name, "{{ agent_user }}"]
      register: agent_groups
      changed_when: false
      failed_when: false
      check_mode: false
      when: agent_exists

    - name: Look at the agents' lingering
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ agent_user }}"
      register: agent_linger

    - name: Look at the agents' home without following a link
      ansible.builtin.stat:
        path: "{{ agent_home }}"
        follow: false
      register: agent_home_stat

    - name: Look at who may use cron
      ansible.builtin.slurp:
        src: /etc/cron.allow
      register: cron_allow
      failed_when: false

    - name: Name every way the agents' account is not the dormant one
      ansible.builtin.set_fact:
        agent_foreign_shape: >-
          {{ (['a uid shared with ' ~ (agent_uid_sharers | join(', '))] if agent_exists and agent_uid_sharers != [agent_user] else [])
             + (['a gid shared with ' ~ (agent_gid_sharers | join(', '))] if agent_gid_sharers != [] else [])
             + (['a primary group other than the group ' ~ agent_user]
                if agent_exists and (agent_user not in every_group or every_group[agent_user][1] != agent_account[2]) else [])
             + (['an id that is not one uid and gid from 1000 up'] if agent_exists and (agent_account[1] != agent_account[2] or agent_account[1] | int < 1000) else [])
             + (['a group ' ~ agent_user ~ ' without the account (sudo groupdel ' ~ agent_user ~ ' removes it)']
                if not agent_exists and agent_user in every_group else [])
             + (['groups that could not be read'] if agent_exists and agent_groups.rc != 0 else [])
             + (['a group beyond its own'] if agent_exists and agent_groups.rc == 0 and agent_groups.stdout.split() != [agent_user] else [])
             + (['a subuid or subgid entry'] if agent_user in subid_owners or (agent_uid | string) in subid_owners else [])
             + (['a shell other than ' ~ agent_nologin] if agent_exists and agent_account[5] != agent_nologin else [])
             + (['a usable password'] if agent_exists and agent_entry.results[1].ansible_facts.getent_shadow[agent_user][0][:1] not in ['!', '*'] else [])
             + (['linger'] if agent_linger.stat.exists else [])
             + (['a home other than ' ~ agent_home] if agent_exists and agent_account[4] != agent_home else [])
             + (['a home that is missing'] if agent_exists and not agent_home_stat.stat.exists else [])
             + (['a home that is a link or not a directory']
                if agent_exists and agent_home_stat.stat.exists and (agent_home_stat.stat.islnk or not agent_home_stat.stat.isdir) else [])
             + (['a home not owned by ' ~ agent_user ~ ':' ~ agent_user]
                if agent_exists and agent_home_stat.stat.exists and agent_home_stat.stat.isdir and not agent_home_stat.stat.islnk
                   and ((agent_home_stat.stat.pw_name | default('')) != agent_user or (agent_home_stat.stat.gr_name | default('')) != agent_user) else [])
             + (['a home path that is already taken'] if not agent_exists and agent_home_stat.stat.exists else [])
             + (['a line in /etc/cron.allow'] if cron_allow.content is defined
                and agent_user in (cron_allow.content | b64decode).split() else []) }}

    - name: Refuse before writing anything when the agents' account has another shape
      ansible.builtin.assert:
        that: agent_foreign_shape | length == 0
        fail_msg: "{{ agent_user }} exists with {{ agent_foreign_shape | join(', ') }}; nothing was written"
        quiet: true

    - name: Look at Docker's daemon.json
      ansible.builtin.stat:
        path: "{{ docker_config_path }}"
      register: docker_config_stat

    - name: Read Docker's daemon.json
      ansible.builtin.slurp:
        src: "{{ docker_config_path }}"
      register: docker_config_file
      when: docker_config_stat.stat.exists

    # An absent file is `{}`; an empty one is malformed. The rescue names the file, which `from_json` would not.
    - name: Parse Docker's daemon.json
      block:
        - name: Take the settings in daemon.json
          ansible.builtin.set_fact:
            docker_config: "{{ (docker_config_file.content | b64decode | from_json) if docker_config_stat.stat.exists else {} }}"
      rescue:
        - name: Refuse a daemon.json that is not JSON
          ansible.builtin.fail:
            msg: "{{ docker_config_path }} is not valid JSON; nothing was written"

    - name: Refuse before writing anything when daemon.json cannot take the journal as its default
      ansible.builtin.assert:
        that:
          - docker_config is mapping
          - "'log-opts' not in docker_config"
          - docker_config['log-driver'] | default(docker_log_driver) == docker_log_driver
        fail_msg: >-
          {{ docker_config_path }} is not a JSON object, or carries `log-opts` or a `log-driver` other than
          {{ docker_log_driver }}; nothing was written
        quiet: true

    - name: Merge the journal into the settings, keeping every other key
      ansible.builtin.set_fact:
        docker_config_merged: "{{ docker_config | combine({'log-driver': docker_log_driver}) | to_nice_json(indent=4) }}"

    - name: Read the default log driver Docker reports
      ansible.builtin.command:
        argv: [docker, info, --format, "{% raw %}{{.LoggingDriver}}{% endraw %}"]
      register: docker_driver
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse before writing anything when Docker does not answer
      ansible.builtin.assert:
        that: docker_driver.rc | default(1) == 0
        fail_msg: "Docker does not answer `docker info`; nothing was written"
        quiet: true

    # `hal check` mails its news through msmtp, which needs the system's trust store for the server certificate.
    # Recommends are off: msmtp-mta (Postfix's replacement as the system mailer) is only suggested and must stay out.
    - name: Install msmtp and the certificate authorities it checks the mail server against
      ansible.builtin.apt:
        name: [msmtp, ca-certificates]
        install_recommends: false
        update_cache: true
        cache_valid_time: 86400

    - name: Purge rsyslog, the journal is the one log store
      ansible.builtin.apt:
        name: rsyslog
        state: absent
        purge: true

    - name: Find rsyslog's files and their rotations
      ansible.builtin.find:
        paths: /var/log
        patterns: "{{ rsyslog_file_names | product(['', '.*']) | map('join') | list }}"
      register: rsyslog_files

    - name: Delete rsyslog's files without a copy
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ rsyslog_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Fill edge's files with this PC's values
      ansible.builtin.set_fact:
        rendered_files: >-
          {{ rendered_files | default([]) + [item | combine({'content': lookup('ansible.builtin.file', edge_tunnel_dir ~ '/' ~ item.src, rstrip=false)
             | replace('@HOME@', home) | replace('@OPERATOR_USER@', operator_user) | replace('@TUNNEL_ID@', tunnel_id)})] }}
      loop: "{{ system_files }}"
      loop_control:
        label: "{{ item.src }}"

    - name: Look at what is in place
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ rendered_files + [{'dest': retired_drop_in}, {'dest': docker_config_path, 'content': docker_config_merged}] }}"
      loop_control:
        label: "{{ item.dest }}"
      register: in_place

    - name: Note what is about to be replaced or deleted
      ansible.builtin.set_fact:
        to_back_up: "{{ to_back_up | default([]) + [item.stat.path] }}"
      loop: "{{ in_place.results }}"
      loop_control:
        label: "{{ item.item.dest }}"
      when: item.stat.exists and (item.item.content is not defined or item.stat.checksum != (item.item.content | hash('sha1')))

    - name: Back up what is about to be replaced or deleted
      when: to_back_up is defined
      block:
        - name: Make this run's backup directory
          ansible.builtin.file:
            path: "{{ backup_dir }}/{{ run_stamp }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Copy each file with its path below the backup directory
          ansible.builtin.command:
            argv: [cp, --archive, --parents, "{{ item }}", "{{ backup_dir }}/{{ run_stamp }}"]
          loop: "{{ to_back_up }}"
          changed_when: true

    - name: Make the drop-in directory
      ansible.builtin.file:
        path: "{{ drop_in_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"  # NOSONAR ansible:S2612 systemd and polkitd read these as their own users; the ruled mode is root-owned 755/644

    - name: Write edge's files, root-owned, mode 644
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"  # NOSONAR ansible:S2612 systemd and polkitd read these as their own users; the ruled mode is root-owned 755/644
      loop: "{{ rendered_files }}"
      loop_control:
        label: "{{ item.dest }}"
      notify: Reload systemd

    - name: Write the journal retention service and timer, root-owned, mode 644
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"  # NOSONAR ansible:S2612 systemd reads these as its own user; the ruled mode is root-owned 644
      loop: "{{ retention_units }}"
      loop_control:
        label: "{{ item.dest }}"
      register: retention_written

    - name: Delete the retired root drop-in, now that the new base unit is in place
      ansible.builtin.file:
        path: "{{ retired_drop_in }}"
        state: absent
      notify: Reload systemd

    # useradd with -K because the user module cannot refuse the subordinate id ranges that login.defs grants by
    # default. The user task after it creates nothing then; in a dry run it is the one that reports the creation.
    # A failed useradd leaves no group behind, so that the next apply finds the account absent and converges.
    - name: Create the agents' group and account
      when: not agent_exists
      block:
        - name: Create the agents' group with the id chosen for the account
          ansible.builtin.command:
            argv: [groupadd, --gid, "{{ agent_gid }}", "{{ agent_user }}"]
          changed_when: true

        - name: Create the agents' account without subordinate id ranges
          ansible.builtin.command:
            argv:
              - useradd
              - --create-home
              - --home-dir
              - "{{ agent_home }}"
              - --gid
              - "{{ agent_gid }}"
              - --shell
              - "{{ agent_nologin }}"
              - --uid
              - "{{ agent_uid }}"
              - -K
              - SUB_UID_COUNT=0
              - -K
              - SUB_GID_COUNT=0
              - "{{ agent_user }}"
          changed_when: true
      rescue:
        - name: Remove the group that was created without its account
          ansible.builtin.command:
            argv: [groupdel, "{{ agent_user }}"]
          changed_when: true

        - name: Fail again, with the group gone
          ansible.builtin.fail:
            msg: "creating {{ agent_user }} failed; its group was removed again"

    - name: Look at the account that was created
      ansible.builtin.getent:
        database: passwd
        key: "{{ agent_user }}"
      register: created_entry
      when: not agent_exists and not ansible_check_mode

    - name: Fail when the account did not get the ids chosen for it
      ansible.builtin.assert:
        that:
          - created_entry.ansible_facts.getent_passwd[agent_user][1] == agent_uid | string
          - created_entry.ansible_facts.getent_passwd[agent_user][2] == agent_gid | string
        fail_msg: "{{ agent_user }} was created with uid {{ created_entry.ansible_facts.getent_passwd[agent_user][1] }} and gid {{ created_entry.ansible_facts.getent_passwd[agent_user][2] }}, not {{ agent_uid }}"
        quiet: true
      when: not agent_exists and not ansible_check_mode

    - name: Keep the agents' account locked, shell-less and with a home
      ansible.builtin.user:
        name: "{{ agent_user }}"
        home: "{{ agent_home }}"
        shell: "{{ agent_nologin }}"
        password_lock: true
        create_home: false

    - name: Close the agents' home to everyone else
      ansible.builtin.file:
        path: "{{ agent_home }}"
        state: directory
        mode: "0700"
      when: agent_exists or not ansible_check_mode

    # An existing cron.allow decides alone: with `agent` in it the play has refused; without, `agent` is denied
    # already and cron.deny stays as it is. An existing cron.deny keeps its owner, mode and entries.
    - name: Look at who is denied cron
      ansible.builtin.stat:
        path: "{{ cron_deny }}"
      register: cron_deny_stat

    - name: Add the agents to the existing cron.deny
      ansible.builtin.lineinfile:
        path: "{{ cron_deny }}"
        line: "{{ agent_user }}"
        regexp: "^{{ agent_user }}$"
      when: cron_deny_stat.stat.exists and cron_allow.content is not defined

    - name: Create cron.deny with the agents in it
      ansible.builtin.lineinfile:
        path: "{{ cron_deny }}"
        line: "{{ agent_user }}"
        create: true
        owner: root
        group: root
        mode: "0644"  # NOSONAR ansible:S2612 cron reads this as the invoking user; root-owned 644 is the ruled mode
      when: not cron_deny_stat.stat.exists and cron_allow.content is not defined

    # `daemon_reload` on every run, so a run interrupted after the files were written converges on the
    # next. Nothing restarts journald: the timer's own service rotates and vacuums it. A check run that
    # would still write the units skips this task, because systemd cannot enable a unit not on disk yet.
    - name: Enable and start the daily journal retention timer
      ansible.builtin.systemd_service:
        name: hal-journal-retention.timer
        daemon_reload: true
        enabled: true
        state: started
      when: not (ansible_check_mode and retention_written.changed)

    # Sorted keys put `log-driver` before `runtimes`, so the diff of the PC's file is one new line.
    - name: Write Docker's daemon.json, root-owned, mode 644
      ansible.builtin.copy:
        content: "{{ docker_config_merged }}"
        dest: "{{ docker_config_path }}"
        owner: root
        group: root
        mode: "0644"  # NOSONAR ansible:S2612 dockerd and the docker CLI read this as their own users; root-owned 644 is the ruled mode
        validate: dockerd --validate --config-file %s

    # The trigger is the driver Docker reports, not a changed file, so a run interrupted after the write restarts next time.
    # The rescue is one rule for every state of the file: without `log-driver`, JSON-equal to the file before this play wrote it.
    - name: Restart Docker until it reports the journal as its default log driver
      when: docker_driver.stdout | trim != docker_log_driver
      block:
        - name: Restart Docker
          ansible.builtin.systemd_service:
            name: docker
            state: restarted

        - name: Read the default log driver Docker reports now
          ansible.builtin.command:
            argv: [docker, info, --format, "{% raw %}{{.LoggingDriver}}{% endraw %}"]
          register: docker_driver_after
          changed_when: false
          when: not ansible_check_mode

        - name: Fail unless Docker reports the journal now
          ansible.builtin.assert:
            that: docker_driver_after.stdout | trim == docker_log_driver
            fail_msg: "Docker reports {{ docker_driver_after.stdout | trim }}, not {{ docker_log_driver }}"
            quiet: true
          when: not ansible_check_mode
      rescue:
        - name: Write daemon.json back without log-driver
          ansible.builtin.copy:
            content: "{{ docker_config | dict2items | rejectattr('key', 'equalto', 'log-driver') | list | items2dict | to_nice_json(indent=4) }}"
            dest: "{{ docker_config_path }}"
            owner: root
            group: root
            mode: "0644"  # NOSONAR ansible:S2612 dockerd and the docker CLI read this as their own users; root-owned 644 is the ruled mode

        - name: Clear the unit's start limit
          ansible.builtin.command:
            argv: [systemctl, reset-failed, docker]
          changed_when: true

        - name: Restart Docker without log-driver
          ansible.builtin.systemd_service:
            name: docker
            state: restarted

        - name: Fail again, with daemon.json back as it was
          ansible.builtin.fail:
            msg: >-
              Docker did not come up reporting {{ docker_log_driver }}; {{ docker_config_path }} was written back without
              `log-driver` and Docker restarted again

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
