# Every secret of this PC by name, place and link. Never a value.
#
# One [[secret]] block per entry. Keys:
#   name        unique name the view shows
#   kind        human-password | tool-login | token | service-password | unverified-token | derived-mirror,
#               or configuration | documentation for a known file under ~/.secrets that holds no secret
#   paths       where it lives, "~/"-relative; only the last part may hold a wildcard
#   read_by     who reads it (declared, shown by `hal secrets --by-service`)
#   recreate    how and where it is created again
#   verify      optional probe of the view; today only "gh auth status"
#   retired_on  with revoke_url: the entry is retired and its revocation is unconfirmed
#   revocation_confirmed  optional, retired entries only: the date the revocation was checked at the provider
#   mirror_of   required for derived-mirror: the entry it is derived from
#   page        required for unverified-token, refused on any other kind: the https page the wizard offers to open
#   purpose     optional: one sentence, what breaks without it; the wizard says it before each step
#   optional    optional, true: its absence is no finding and the wizard skips it
#   elsewhere   optional: copies outside the home, named in the view's "Place" column and never read
#   loosest_mode         optional: the loosest mode a file of the entry may have, as a TOML octal (0o644); without it 0600.
#                        Never looser than 0644. Only for a file a container user must read in a 0700 folder.
#   loosest_mode_reason  required with loosest_mode: one line, who needs it and why
#   value_prefix         optional, service-password only: the text `hal setup` puts in front of the value it generates
#
# A token the wizard guides through names where it is created, all four keys together:
#   provider         github | cloudflare
#   resource         GitHub: the resource owner; Cloudflare: the zone the token reaches
#   scope            the rights to grant; GitHub: "<URL parameter>:read|write|admin" as its token form takes them,
#                    Cloudflare: "<group> › <permission> › <level>" as its dashboard spells them
#   expires_in_days  1 to 366; GitHub takes it as expires_in, Cloudflare as the TTL's end date
# The rights follow overnightworks/edge docs/architecture.md (layer L3, section 4, D6 and D8) and edge#30.
# A service-password entry has one path; the wizard generates its value and never shows it, unless the entry is optional:
# then the unit named in `recreate` writes it.
# An unverified-token entry has one path and no token keys, and names `page`, an https:// link the wizard offers to open; the wizard
# asks its value hidden and stores it without provider verification.
#
# The three entries of the publish of `hal apply` come first, read-only before write.

[[secret]]
name = "cloudflare/fleet-read"
kind = "token"
paths = ["~/.secrets/cloudflare/fleet-read"]
read_by = ["hal check hosts", "hal apply"]
recreate = "https://dash.cloudflare.com/profile/api-tokens"
purpose = "hal apply and hal check hosts read it to see DNS, Access, the tunnel, the zone settings (HSTS) and the visitor-address transform rule at Cloudflare, changing nothing."
provider = "cloudflare"
resource = "hallucinai.de"
scope = [
    "Account › Cloudflare Tunnel › Read",
    "Account › Access: Apps and Policies › Read",
    "Account › Access: Organizations, Identity Providers, and Groups › Read",
    "Account › Access: Service Tokens › Read",
    "Zone › Zone › Read",
    "Zone › DNS › Read",
    "Zone › Zone Settings › Read",
    "Zone › Transform Rules › Read",
]
expires_in_days = 366

[[secret]]
name = "opentofu/state-passphrase"
kind = "service-password"
paths = ["~/.secrets/opentofu/state-passphrase"]
read_by = ["hal apply"]
recreate = "the wizard creates it; losing it makes the encrypted OpenTofu state unreadable"
purpose = "OpenTofu encrypts state and plan with it under ~/.secrets/opentofu."

[[secret]]
name = "cloudflare/fleet-write"
kind = "token"
paths = ["~/.secrets/cloudflare/fleet-write"]
read_by = ["hal apply"]
recreate = "https://dash.cloudflare.com/profile/api-tokens"
purpose = "hal apply writes DNS, Access apps, the tunnel rows, the zone settings (HSTS) and the visitor-address transform rule at Cloudflare with it; only the operator applies."
provider = "cloudflare"
resource = "hallucinai.de"
scope = [
    "Account › Cloudflare Tunnel › Edit",
    "Account › Access: Apps and Policies › Edit",
    "Account › Access: Organizations, Identity Providers, and Groups › Read",
    "Zone › Zone › Read",
    "Zone › DNS › Edit",
    "Zone › Zone Settings › Edit",
    "Zone › Transform Rules › Edit",
]
expires_in_days = 366

# What tofu leaves under ~/.secrets/opentofu: encrypted with opentofu/state-passphrase and written for the owner only, so no secret in the clear.
# The first plan or apply creates them, so their absence is no finding. Each file is named exactly, so any other file beside them stays an unknown-file.
[[secret]]
name = "opentofu/state"
kind = "configuration"
paths = ["~/.secrets/opentofu/fleet.tfstate"]
read_by = ["hal apply"]
recreate = "cannot be recreated: losing it makes plan show everything as new; import the resources first, then apply"
purpose = "OpenTofu remembers in it which resources it manages."
optional = true

[[secret]]
name = "opentofu/state-backup"
kind = "configuration"
paths = ["~/.secrets/opentofu/fleet.tfstate.backup"]
read_by = ["hal apply"]
recreate = "cannot be recreated: tofu writes it only when an apply changes an existing state; losing it costs only this one backup"
purpose = "OpenTofu keeps the previous state here, saved at the last apply that changed it; it does not exist before the first such apply."
optional = true

[[secret]]
name = "opentofu/plans"
kind = "configuration"
paths = ["~/.secrets/opentofu/plans"]
read_by = ["hal apply"]
recreate = "hal apply plans again; a lost plan costs only the plan run"
purpose = "hal apply stores the encrypted plan here, which the operator approves."
optional = true

[[secret]]
name = "opentofu/tmp"
kind = "configuration"
paths = ["~/.secrets/opentofu/tmp"]
read_by = ["hal apply"]
recreate = "hal apply creates the folder itself"
purpose = "OpenTofu gets a private TMPDIR here, emptied after every run."
optional = true

# The files step-ca/init and keycloak/go-live write. Their containers run as other users, so a file may be 0644 inside its 0700 folder.
# Each unit's own --check owns presence, so every entry is optional: the daily check judges the modes and never reports one missing.
[[secret]]
name = "step-ca/root_ca_key"
kind = "token"
paths = ["~/.secrets/step-ca/root_ca_key"]
read_by = ["step-ca/init"]
recreate = "step-ca/init; a new key invalidates every certificate issued so far and the root in the clients"
purpose = "The internal CA root key; only step-ca/init reads it, in a one-shot container without network, never in the running service."
optional = true

[[secret]]
name = "step-ca/password"
kind = "service-password"
paths = ["~/.secrets/step-ca/password"]
read_by = ["step-ca"]
recreate = "step-ca/init; without the old password the CA keys are unreadable"
purpose = "The CA password protects the root and intermediate keys; the service reads it as a Docker secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "step-ca reads it in the container as uid 1000; the 0700 folder keeps everyone else out"

[[secret]]
name = "step-ca/root_ca.crt"
kind = "configuration"
paths = ["~/.secrets/step-ca/root_ca.crt"]
read_by = ["traefik-mcp", "step-ca", "speech"]
recreate = "step-ca/init"
purpose = "The internal CA root certificate; holds no secret. Without it traefik-mcp and the speech service do not trust the CA."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "traefik-mcp reads it as uid 65534, the speech service as uid 1001"

# The folder exists only while an init was interrupted; its two files are the key and the certificate on their way to their place,
# under the names `create_root` in step-ca/init gives them.
[[secret]]
name = "step-ca/pending-root/root_ca_key"
kind = "token"
paths = ["~/.secrets/step-ca/.pending-root/root_ca_key"]
read_by = ["step-ca/init"]
recreate = "step-ca/init resumes an interrupted setup and cleans up the folder"
purpose = "The root key on its way to its place; it stays 0600."
optional = true

[[secret]]
name = "step-ca/pending-root/root_ca.crt"
kind = "configuration"
paths = ["~/.secrets/step-ca/.pending-root/root_ca.crt"]
read_by = ["step-ca/init"]
recreate = "step-ca/init resumes an interrupted setup and cleans up the folder"
purpose = "The root certificate on its way to its place; holds no secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "init sets it to 0644 when it publishes it"

[[secret]]
name = "keycloak/db-password"
kind = "service-password"
paths = ["~/.secrets/keycloak/db-password"]
read_by = ["keycloak", "keycloak-db"]
recreate = "keycloak/go-live creates only a missing file; a new password does not fit the existing database"
purpose = "The password of the Keycloak database user."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the containers read it as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "keycloak/config-cli-secret"
kind = "service-password"
paths = ["~/.secrets/keycloak/config-cli-secret"]
read_by = ["keycloak", "keycloak-config-cli"]
recreate = "keycloak/go-live creates only a missing file"
purpose = "The client secret keycloak-config-cli uses to apply the realm."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the containers read it as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "keycloak/bootstrap-admin-password"
kind = "service-password"
paths = ["~/.secrets/keycloak/bootstrap-admin-password"]
read_by = ["keycloak"]
recreate = "keycloak/go-live"
purpose = "The password of the temporary administrator; keycloak/go-live deletes the file in step 7, so afterwards it is rightly missing."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the Keycloak container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "keycloak/clients/*"
kind = "token"
paths = ["~/.secrets/keycloak/clients/*"]
read_by = ["keycloak-config-cli", "edge", "hopin", "presentator", "skat"]
recreate = "keycloak/go-live creates only a missing file, one per confidential client"
purpose = "One file per confidential client of the realm, holding its secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the containers read them as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "hopin/session-secret"
kind = "service-password"
paths = ["~/.secrets/hopin/session-secret"]
read_by = ["hopin"]
recreate = "hal setup creates only a missing file"
purpose = "The secret HopIn signs its sessions with."
loosest_mode = 0o644
loosest_mode_reason = "the HopIn container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "presentator/secret-key"
kind = "service-password"
paths = ["~/.secrets/presentator/secret-key"]
read_by = ["presentator"]
recreate = "hal setup creates only a missing file; a new value makes the source secrets presentator stored unreadable and signs everyone out"
purpose = "The master key presentator encrypts its stored source secrets with and signs its sessions with."
loosest_mode = 0o644
loosest_mode_reason = "the presentator container reads it as its own user; the 0700 folder keeps everyone else out"

# songmaker's stack secrets, one compose secret file each. Its containers read them as their own users, postgres and prometheus among
# them, so each file may be 0644 in the 0700 folder.
[[secret]]
name = "songmaker/session-secret"
kind = "service-password"
paths = ["~/.secrets/songmaker/session-secret"]
read_by = ["songmaker-web", "songmaker-music-worker", "songmaker-scoring-worker"]
recreate = "hal setup creates only a missing file; a new value signs everyone out"
purpose = "The secret songmaker signs its sessions with."
loosest_mode = 0o644
loosest_mode_reason = "songmaker's containers read it as their own users; the 0700 folder keeps everyone else out"

[[secret]]
name = "songmaker/postgres-password"
kind = "service-password"
paths = ["~/.secrets/songmaker/postgres-password"]
read_by = ["songmaker-postgres", "songmaker-migrate", "songmaker-web", "songmaker-music-worker", "songmaker-scoring-worker"]
recreate = "hal setup creates only a missing file; a new value locks songmaker out of its database, which keeps the password it was created with"
purpose = "The password of songmaker's database; songmaker's services connect with it, and postgres takes it as POSTGRES_PASSWORD_FILE once songmaker's compose mounts it."
loosest_mode = 0o644
loosest_mode_reason = "postgres (uid 70) and songmaker's containers read it as their own users; the 0700 folder keeps everyone else out"

[[secret]]
name = "songmaker/internal-token"
kind = "service-password"
paths = ["~/.secrets/songmaker/internal-token"]
read_by = ["songmaker-web", "songmaker-music-worker", "songmaker-acestep-worker-0", "songmaker-scoring-worker"]
recreate = "hal setup creates only a missing file"
purpose = "The token songmaker's web service and its workers authenticate their internal calls with."
loosest_mode = 0o644
loosest_mode_reason = "songmaker's containers read it as their own users; the 0700 folder keeps everyone else out"

[[secret]]
name = "songmaker/monitoring-token"
kind = "service-password"
paths = ["~/.secrets/songmaker/monitoring-token"]
read_by = ["songmaker-web", "songmaker-prometheus"]
recreate = "hal setup creates only a missing file"
purpose = "The token Prometheus sends and songmaker's web service checks on /metrics."
loosest_mode = 0o644
loosest_mode_reason = "prometheus (uid 65534) and songmaker-web read it as their own users; the 0700 folder keeps everyone else out"

# Not optional: songmaker's scripts/secret_files.py --verify refuses a missing file. An empty file means anonymous downloads; the
# wizard cannot store one (an empty paste skips), so that file is made by hand.
[[secret]]
name = "songmaker/hf-token"
kind = "unverified-token"
paths = ["~/.secrets/songmaker/hf-token"]
read_by = ["songmaker-acestep-worker-0", "songmaker-scoring-worker (image build)", "songmaker scripts/download_models.sh"]
page = "https://huggingface.co/settings/tokens"
recreate = "Hugging Face › Settings › Access Tokens: create a read token; for anonymous downloads put an empty file there instead, mode 644"
purpose = "The Hugging Face token songmaker downloads its models with; an empty file downloads them anonymously."
loosest_mode = 0o644
loosest_mode_reason = "songmaker's containers read it as their own users; the 0700 folder keeps everyone else out"

[[secret]]
name = "songmaker/redis-ops"
kind = "service-password"
paths = ["~/.secrets/songmaker/redis-ops"]
read_by = ["songmaker-redis"]
recreate = "hal setup creates only a missing file"
purpose = "The password of Redis's operator user; nothing reads it until songmaker#2270 gives Redis its users."
loosest_mode = 0o644
loosest_mode_reason = "songmaker's Redis container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "songmaker/redis-app"
kind = "service-password"
paths = ["~/.secrets/songmaker/redis-app"]
read_by = ["songmaker-redis", "songmaker-web", "songmaker-music-worker", "songmaker-scoring-worker"]
recreate = "hal setup creates only a missing file"
purpose = "The password of the Redis user songmaker's app services share; nothing reads it until songmaker#2270 gives Redis its users."
loosest_mode = 0o644
loosest_mode_reason = "songmaker's containers read it as their own users; the 0700 folder keeps everyone else out"

[[secret]]
name = "songmaker/redis-gpu-acestep-worker-0"
kind = "service-password"
paths = ["~/.secrets/songmaker/redis-gpu-acestep-worker-0"]
read_by = ["songmaker-redis", "songmaker-acestep-worker-0"]
recreate = "hal setup creates only a missing file"
purpose = "The password of the Redis user only GPU worker 0 holds; nothing reads it until songmaker#2270 gives Redis its users."
loosest_mode = 0o644
loosest_mode_reason = "songmaker's containers read it as their own users; the 0700 folder keeps everyone else out"

[[secret]]
name = "cloudflare/turn-hopin/key-id"
kind = "unverified-token"
paths = ["~/.secrets/cloudflare/turn-hopin/key-id"]
read_by = ["hopin"]
page = "https://dash.cloudflare.com/"
recreate = "Cloudflare dashboard › Realtime › TURN: create a TURN key; Cloudflare shows the key ID and API token only once"
purpose = "The key ID of the TURN key HopIn uses to relay connections behind strict firewalls; stored, not verified."
loosest_mode = 0o644
loosest_mode_reason = "the HopIn container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "cloudflare/turn-hopin/api-token"
kind = "unverified-token"
paths = ["~/.secrets/cloudflare/turn-hopin/api-token"]
read_by = ["hopin"]
page = "https://dash.cloudflare.com/"
recreate = "Cloudflare dashboard › Realtime › TURN: create a TURN key; Cloudflare shows the key ID and API token only once"
purpose = "The API token of the TURN key HopIn uses to create short-lived credentials for connections behind strict firewalls; stored, not verified."
loosest_mode = 0o644
loosest_mode_reason = "the HopIn container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "litellm/anthropic"
kind = "unverified-token"
paths = ["~/.secrets/litellm/anthropic"]
read_by = ["litellm"]
page = "https://platform.claude.com/settings/keys"
recreate = "Anthropic Console, in the workspace that holds the prepaid credit: create an API key there; Anthropic shows it only once"
purpose = "The provider key LiteLLM calls Anthropic with once the API route is switched on; stored, not verified, because nothing calls Anthropic before the operator says so."

[[secret]]
name = "litellm/openai"
kind = "unverified-token"
paths = ["~/.secrets/litellm/openai"]
read_by = ["litellm"]
page = "https://platform.openai.com/api-keys"
recreate = "OpenAI Platform, in the project that holds the credit: create a new secret key there; OpenAI shows it only once"
purpose = "The provider key LiteLLM calls OpenAI with for pictures once the API route is switched on; stored, not verified, because nothing calls OpenAI before the operator says so."

[[secret]]
name = "litellm/master-key"
kind = "service-password"
paths = ["~/.secrets/litellm/master-key"]
read_by = ["litellm", "litellm-keys"]
recreate = "hal setup creates only a missing file; a new one takes effect at the next recreate of litellm"
purpose = "LiteLLM refuses to boot without a master key; LiteLLM and hal apply's key step hold it and no app does, so its admin routes stay closed to the apps."

[[secret]]
name = "litellm/db-password"
kind = "service-password"
paths = ["~/.secrets/litellm/db-password"]
read_by = ["litellm", "litellm-db"]
recreate = "hal setup creates only a missing file; a new password does not fit the existing database"
purpose = "The password of the LiteLLM database user."
loosest_mode = 0o644
loosest_mode_reason = "the containers read it as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "litellm/apps/songmaker"
kind = "service-password"
paths = ["~/.secrets/litellm/apps/songmaker"]
read_by = ["songmaker", "litellm-keys"]
recreate = "hal setup creates only a missing file; a new one takes effect at the next recreate of songmaker and at the next hal apply, which makes its key row, or, while the old key holds the name songmaker, names it as name taken and makes nothing for it"
purpose = "Songmaker's own LiteLLM key; LiteLLM takes a custom key only with the prefix sk-, so setup writes it with that prefix."
value_prefix = "sk-"
loosest_mode = 0o644
loosest_mode_reason = "the app's container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "litellm/apps/hopin"
kind = "service-password"
paths = ["~/.secrets/litellm/apps/hopin"]
read_by = ["hopin", "litellm-keys", "agent-canary"]
recreate = "hal setup creates only a missing file; a new one takes effect at the next recreate of hopin and at the next hal apply, which makes its key row, or, while the old key holds the name hopin, names it as name taken and makes nothing for it; agent-canary reads the new file at its next run"
purpose = "Hopin's own LiteLLM key; LiteLLM takes a custom key only with the prefix sk-, so setup writes it with that prefix."
value_prefix = "sk-"
loosest_mode = 0o644
loosest_mode_reason = "the app's container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "litellm/apps/presentator"
kind = "service-password"
paths = ["~/.secrets/litellm/apps/presentator"]
read_by = ["presentator", "litellm-keys"]
recreate = "hal setup creates only a missing file; a new one takes effect at the next recreate of presentator and at the next hal apply, which makes its key row, or, while the old key holds the name presentator, names it as name taken and makes nothing for it"
purpose = "Presentator's own LiteLLM key; LiteLLM takes a custom key only with the prefix sk-, so setup writes it with that prefix."
value_prefix = "sk-"
loosest_mode = 0o644
loosest_mode_reason = "the app's container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "restic/password"
kind = "human-password"
paths = ["~/.secrets/restic/password"]
read_by = ["hal-backup.service", "hal-backup-restore-test.service"]
recreate = "Restore it from your password manager. Never recreate it while backups exist under ~/backups/restic: a new password makes them unreadable."
purpose = "hal backup encrypts the restic backups with it; without it they are unreadable."

# The mail account of `hal check`: the account in one file, the app password in the other. msmtp, run as the operator,
# reads the password at send time; songmaker may read the same files later. Created by hand, so the wizard only names them.
[[secret]]
name = "smtp/password"
kind = "token"
paths = ["~/.secrets/smtp/password"]
read_by = ["hal check"]
recreate = "Create a new app password at the mail provider, revoke the old one, replace the file and update the copy in songmaker/.env by hand"
purpose = "msmtp reads it when hal check sends its mail; the file holds only the password."

[[secret]]
name = "smtp/account.toml"
kind = "configuration"
paths = ["~/.secrets/smtp/account.toml"]
read_by = ["hal check"]
recreate = "Create it by hand: host, port, user and to as TOML, never the password"
purpose = "Account for the mail of hal check (server, port, sender, recipient); without it hal check sends no mail."

