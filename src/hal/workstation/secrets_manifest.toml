# Every secret of this PC by name, place and link. Never a value.
#
# One [[secret]] block per entry. Keys:
#   name        unique name the view shows
#   kind        human-password | tool-login | token | service-password | unverified-token | derived-mirror,
#               or configuration | documentation for a known file under ~/.secrets that holds no secret
#   paths       where it lives, "~/"-relative; only the last part may hold a wildcard
#   read_by     who reads it (declared, shown by `hal secrets --by-service`)
#   recreate    how and where it is created again; absent on an entry with `create`, whose renewal is derived from it
#   create      optional, tool-login only: the CLI that makes the secret itself, `run` (its argv), `label` (whose account it is) and
#               `home` (the variables hal points at a fresh private home); `hal setup` runs it there and moves only the login
#               file into the entry's folder, never reading what the CLI wrote
#   verify      optional probe of the view; today only "gh auth status"
#   retired_on  with revoke_url: the entry is retired and its revocation is unconfirmed
#   revocation_confirmed  optional, retired entries only: the date the revocation was checked at the provider
#   mirror_of   required for derived-mirror: the entry it is derived from
#   page        required for unverified-token, refused on any other kind: the https page the wizard offers to open
#   purpose     optional: one sentence, what breaks without it; the wizard says it before each step
#   optional    optional, true: its absence is no finding and the wizard skips it
#   elsewhere   optional: copies outside the home, named in the view's "Place" column and never read
#   loosest_mode         optional: the loosest mode a file of the entry may have, as a TOML octal (0o644); without it 0600.
#                        Never looser than 0644. Only for a file a container user must read in a 0700 folder.
#   loosest_mode_reason  required with loosest_mode: one line, who needs it and why
#
# A token the wizard guides through names where it is created, all four keys together:
#   provider         github | cloudflare
#   resource         GitHub: the resource owner; Cloudflare: the zone the token reaches
#   scope            the rights to grant; GitHub: "<URL parameter>:read|write|admin" as its token form takes them,
#                    Cloudflare: "<group> › <permission> › <level>" as its dashboard spells them
#   expires_in_days  1 to 366; GitHub takes it as expires_in, Cloudflare as the TTL's end date
# The rights follow overnightworks/edge docs/architecture.md (layer L3, section 4, D6 and D8) and edge#30.
# A service-password entry has one path; the wizard generates its value and never shows it, unless the entry is optional:
# then the unit named in `recreate` writes it.
# An unverified-token entry has one path and no token keys, and names `page`, an https:// link the wizard offers to open; the wizard
# asks its value hidden and stores it without provider verification.
#
# The five entries of the publish of `hal apply` come first, read-only before write;
# the two GitHub tokens are read by nothing until edge#30 X2/X3.

[[secret]]
name = "cloudflare/fleet-read"
kind = "token"
paths = ["~/.secrets/cloudflare/fleet-read"]
read_by = ["hal check hosts", "hal apply"]
recreate = "https://dash.cloudflare.com/profile/api-tokens"
purpose = "hal apply and hal check hosts read it to see DNS, Access, the tunnel, the zone settings (HSTS) and the visitor-address transform rule at Cloudflare, changing nothing."
provider = "cloudflare"
resource = "hallucinai.de"
scope = [
    "Account › Cloudflare Tunnel › Read",
    "Account › Access: Apps and Policies › Read",
    "Account › Access: Organizations, Identity Providers, and Groups › Read",
    "Account › Access: Service Tokens › Read",
    "Zone › Zone › Read",
    "Zone › DNS › Read",
    "Zone › Zone Settings › Read",
    "Zone › Transform Rules › Read",
]
expires_in_days = 366

[[secret]]
name = "github/fleet-read"
kind = "token"
paths = ["~/.secrets/github/fleet-read"]
read_by = []
recreate = "https://github.com/settings/personal-access-tokens/new"
purpose = "Nothing reads it today; hal apply needs it again once edge#30 X2/X3 builds the GitHub settings as code (repo settings, rulesets, Actions rules, org secret names, never their values). The file stays, nothing is revoked."
provider = "github"
resource = "overnightworks"
scope = [
    "metadata:read",
    "administration:read",
    "repository_custom_properties:read",
    "secrets:read",
    "dependabot_secrets:read",
    "organization_administration:read",
    "organization_custom_properties:read",
    "organization_secrets:read",
    "organization_dependabot_secrets:read",
]
expires_in_days = 366

[[secret]]
name = "opentofu/state-passphrase"
kind = "service-password"
paths = ["~/.secrets/opentofu/state-passphrase"]
read_by = ["hal apply"]
recreate = "the wizard creates it; losing it makes the encrypted OpenTofu state unreadable"
purpose = "OpenTofu encrypts state and plan with it under ~/.secrets/opentofu."

[[secret]]
name = "cloudflare/fleet-write"
kind = "token"
paths = ["~/.secrets/cloudflare/fleet-write"]
read_by = ["hal apply"]
recreate = "https://dash.cloudflare.com/profile/api-tokens"
purpose = "hal apply writes DNS, Access apps, the tunnel rows, the zone settings (HSTS) and the visitor-address transform rule at Cloudflare with it; only the operator applies."
provider = "cloudflare"
resource = "hallucinai.de"
scope = [
    "Account › Cloudflare Tunnel › Edit",
    "Account › Access: Apps and Policies › Edit",
    "Account › Access: Organizations, Identity Providers, and Groups › Read",
    "Zone › Zone › Read",
    "Zone › DNS › Edit",
    "Zone › Zone Settings › Edit",
    "Zone › Transform Rules › Edit",
]
expires_in_days = 366

[[secret]]
name = "github/fleet-admin"
kind = "token"
paths = ["~/.secrets/github/fleet-admin"]
read_by = []
recreate = "https://github.com/settings/personal-access-tokens/new"
purpose = "Nothing reads it today; hal apply needs it again once edge#30 X2/X3 builds the GitHub settings as code (repo settings, rulesets, Actions rules, org secret reach; only the operator applies). The file stays, nothing is revoked."
provider = "github"
resource = "overnightworks"
scope = [
    "metadata:read",
    "administration:write",
    "repository_custom_properties:write",
    "secrets:read",
    "dependabot_secrets:read",
    "organization_administration:write",
    "organization_custom_properties:admin",
    "organization_secrets:write",
    "organization_dependabot_secrets:write",
]
expires_in_days = 366

# What tofu leaves under ~/.secrets/opentofu: encrypted with opentofu/state-passphrase and written for the owner only, so no secret in the clear.
# The first plan or apply creates them, so their absence is no finding. Each file is named exactly, so any other file beside them stays an unknown-file.
[[secret]]
name = "opentofu/state"
kind = "configuration"
paths = ["~/.secrets/opentofu/fleet.tfstate"]
read_by = ["hal apply"]
recreate = "cannot be recreated: losing it makes plan show everything as new; import the resources first, then apply"
purpose = "OpenTofu remembers in it which resources it manages."
optional = true

[[secret]]
name = "opentofu/state-backup"
kind = "configuration"
paths = ["~/.secrets/opentofu/fleet.tfstate.backup"]
read_by = ["hal apply"]
recreate = "cannot be recreated: tofu writes it only when an apply changes an existing state; losing it costs only this one backup"
purpose = "OpenTofu keeps the previous state here, saved at the last apply that changed it; it does not exist before the first such apply."
optional = true

[[secret]]
name = "opentofu/plans"
kind = "configuration"
paths = ["~/.secrets/opentofu/plans"]
read_by = ["hal apply"]
recreate = "hal apply plans again; a lost plan costs only the plan run"
purpose = "hal apply stores the encrypted plan here, which the operator approves."
optional = true

[[secret]]
name = "opentofu/tmp"
kind = "configuration"
paths = ["~/.secrets/opentofu/tmp"]
read_by = ["hal apply"]
recreate = "hal apply creates the folder itself"
purpose = "OpenTofu gets a private TMPDIR here, emptied after every run."
optional = true

# The files step-ca/init and keycloak/go-live write. Their containers run as other users, so a file may be 0644 inside its 0700 folder.
# Each unit's own --check owns presence, so every entry is optional: the daily check judges the modes and never reports one missing.
[[secret]]
name = "step-ca/root_ca_key"
kind = "token"
paths = ["~/.secrets/step-ca/root_ca_key"]
read_by = ["step-ca/init"]
recreate = "step-ca/init; a new key invalidates every certificate issued so far and the root in the clients"
purpose = "The internal CA root key; only step-ca/init reads it, in a one-shot container without network, never in the running service."
optional = true

[[secret]]
name = "step-ca/password"
kind = "service-password"
paths = ["~/.secrets/step-ca/password"]
read_by = ["step-ca"]
recreate = "step-ca/init; without the old password the CA keys are unreadable"
purpose = "The CA password protects the root and intermediate keys; the service reads it as a Docker secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "step-ca reads it in the container as uid 1000; the 0700 folder keeps everyone else out"

[[secret]]
name = "step-ca/root_ca.crt"
kind = "configuration"
paths = ["~/.secrets/step-ca/root_ca.crt"]
read_by = ["traefik-mcp", "agent-service", "step-ca"]
recreate = "step-ca/init"
purpose = "The internal CA root certificate; holds no secret. Without it traefik-mcp and the agent service do not trust the CA."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "traefik-mcp reads it as uid 65534, the agent service as uid 1000"

# The folder exists only while an init was interrupted; its two files are the key and the certificate on their way to their place,
# under the names `create_root` in step-ca/init gives them.
[[secret]]
name = "step-ca/pending-root/root_ca_key"
kind = "token"
paths = ["~/.secrets/step-ca/.pending-root/root_ca_key"]
read_by = ["step-ca/init"]
recreate = "step-ca/init resumes an interrupted setup and cleans up the folder"
purpose = "The root key on its way to its place; it stays 0600."
optional = true

[[secret]]
name = "step-ca/pending-root/root_ca.crt"
kind = "configuration"
paths = ["~/.secrets/step-ca/.pending-root/root_ca.crt"]
read_by = ["step-ca/init"]
recreate = "step-ca/init resumes an interrupted setup and cleans up the folder"
purpose = "The root certificate on its way to its place; holds no secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "init sets it to 0644 when it publishes it"

[[secret]]
name = "keycloak/db-password"
kind = "service-password"
paths = ["~/.secrets/keycloak/db-password"]
read_by = ["keycloak", "keycloak-db"]
recreate = "keycloak/go-live creates only a missing file; a new password does not fit the existing database"
purpose = "The password of the Keycloak database user."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the containers read it as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "keycloak/config-cli-secret"
kind = "service-password"
paths = ["~/.secrets/keycloak/config-cli-secret"]
read_by = ["keycloak", "keycloak-config-cli"]
recreate = "keycloak/go-live creates only a missing file"
purpose = "The client secret keycloak-config-cli uses to apply the realm."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the containers read it as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "keycloak/bootstrap-admin-password"
kind = "service-password"
paths = ["~/.secrets/keycloak/bootstrap-admin-password"]
read_by = ["keycloak"]
recreate = "keycloak/go-live"
purpose = "The password of the temporary administrator; keycloak/go-live deletes the file in step 7, so afterwards it is rightly missing."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the Keycloak container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "keycloak/clients/*"
kind = "token"
paths = ["~/.secrets/keycloak/clients/*"]
read_by = ["keycloak-config-cli", "edge", "hopin"]
recreate = "keycloak/go-live creates only a missing file, one per confidential client"
purpose = "One file per confidential client of the realm, holding its secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "the containers read them as their own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "hopin/session-secret"
kind = "service-password"
paths = ["~/.secrets/hopin/session-secret"]
read_by = ["hopin"]
recreate = "hal setup creates only a missing file"
purpose = "The secret HopIn signs its sessions with."
loosest_mode = 0o644
loosest_mode_reason = "the HopIn container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "cloudflare/turn-hopin/key-id"
kind = "unverified-token"
paths = ["~/.secrets/cloudflare/turn-hopin/key-id"]
read_by = ["hopin"]
page = "https://dash.cloudflare.com/"
recreate = "Cloudflare dashboard › Realtime › TURN: create a TURN key; Cloudflare shows the key ID and API token only once"
purpose = "The key ID of the TURN key HopIn uses to relay connections behind strict firewalls; stored, not verified."
loosest_mode = 0o644
loosest_mode_reason = "the HopIn container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "cloudflare/turn-hopin/api-token"
kind = "unverified-token"
paths = ["~/.secrets/cloudflare/turn-hopin/api-token"]
read_by = ["hopin"]
page = "https://dash.cloudflare.com/"
recreate = "Cloudflare dashboard › Realtime › TURN: create a TURN key; Cloudflare shows the key ID and API token only once"
purpose = "The API token of the TURN key HopIn uses to create short-lived credentials for connections behind strict firewalls; stored, not verified."
loosest_mode = 0o644
loosest_mode_reason = "the HopIn container reads it as its own user; the 0700 folder keeps everyone else out"

[[secret]]
name = "litellm/anthropic"
kind = "unverified-token"
paths = ["~/.secrets/litellm/anthropic"]
read_by = ["litellm"]
page = "https://platform.claude.com/settings/keys"
recreate = "Anthropic Console, in the workspace that holds the prepaid credit: create an API key there; Anthropic shows it only once"
purpose = "The provider key LiteLLM calls Anthropic with once the API route is switched on; stored, not verified, because nothing calls Anthropic before the operator says so."

# The agent service's subscription login: one line, the token `claude setup-token` prints, which `agent-service/setup` writes
# (edge docs/agent-service.md, "The login"). The service reads the folder through a read-only directory bind, and a renewal writes
# `token.new` beside `token` and renames it over; both names are known, so the renewal shows no unknown file.
[[secret]]
name = "agent-service-claude"
kind = "token"
paths = ["~/.secrets/agent-service/claude/token*"]
read_by = ["agent-service"]
recreate = "edge: agent-service/setup --renew (asks for the token `claude setup-token` prints, up to an empty line, without showing it); edge docs/agent-service.md"
purpose = "The subscription login of the agent service for Claude; without it the service does not start."
optional = true

# The agent service's Codex login: the `auth.json` that `codex login` writes into a fresh CODEX_HOME, a login apart from the operator's
# ~/.codex so that neither rotates the other's refresh token (edge docs/agent-service.md, "The login"). The service renews it through
# `.auth.json.new` beside it, the one other name expected in the folder it can write.
[[secret]]
name = "agent-service/codex"
kind = "tool-login"
paths = ["~/.secrets/agent-service/codex/auth.json"]
read_by = ["agent-service"]
create = { run = ["codex", "login"], home = ["CODEX_HOME"], label = "Codex" }
purpose = "the agent service runs Codex for the apps"

# The agent service's signing key pair (edge docs/agent-service.md, "The signing key"): `agent-service/setup` makes it, the service signs with
# the private key and songmaker-web verifies with the public half. The `.new` temporary names match the two paths below; the `.next.pem` names of
# --replace-signing-key do not on purpose, so that leftover shows as an unknown file until setup clears it. Presence belongs to `agent-service/setup --check`.
[[secret]]
name = "agent-service/signing-key"
kind = "token"
paths = ["~/.secrets/agent-service/signing/private.pem*"]
read_by = ["agent-service"]
recreate = "edge: agent-service/setup --replace-signing-key (terminal only, after a typed yes); then recreate agent-service and songmaker-web"
purpose = "The agent service signing key for the app tools' capabilities; only agent-service/setup creates it."
optional = true

[[secret]]
name = "agent-service/signing-public-key"
kind = "configuration"
paths = ["~/.secrets/agent-service/signing/public.pem*"]
read_by = ["songmaker-web"]
recreate = "edge: agent-service/setup derives it again from the private key; a new pair only with agent-service/setup --replace-signing-key, then recreate agent-service and songmaker-web"
purpose = "The public half of the signing key; songmaker-web verifies the capabilities with it and mounts exactly this file. Holds no secret."
optional = true
loosest_mode = 0o644
loosest_mode_reason = "songmaker-web reads it as its own user; the 0700 folder keeps everyone else out"

# The agent service's API route (edge docs/agent-service.md, "The API credential"): `agent-service/setup` makes the service credential,
# a JSON file with `shared_key` that agent-service and litellm read; `hal setup` generates the master key that LiteLLM refuses to boot
# without. `credential.next.json` of --replace-api-credential is outside the path on purpose, so that leftover shows as an unknown file
# until setup clears it. Presence of the credential belongs to `agent-service/setup --check`.
[[secret]]
name = "agent-service/api-credential"
kind = "token"
paths = ["~/.secrets/agent-service/api/credential.json*"]
read_by = ["agent-service", "litellm"]
recreate = "edge: agent-service/setup --replace-api-credential (terminal only, after a typed yes); then recreate litellm, and agent-service while its service.toml has an [api] table"
purpose = "The shared key of the agent service's API route; without it LiteLLM refuses every request, and only agent-service/setup creates it."
optional = true

[[secret]]
name = "litellm/master-key"
kind = "service-password"
paths = ["~/.secrets/litellm/master-key"]
read_by = ["litellm"]
recreate = "hal setup creates only a missing file; a new one takes effect at the next recreate of litellm"
purpose = "LiteLLM refuses to boot without a master key; nobody holds this one, so its admin routes stay closed."

[[secret]]
name = "restic/password"
kind = "human-password"
paths = ["~/.secrets/restic/password"]
read_by = ["hal-backup.service", "hal-backup-restore-test.service"]
recreate = "Restore it from your password manager. Never recreate it while backups exist under ~/backups/restic: a new password makes them unreadable."
purpose = "hal backup encrypts the restic backups with it; without it they are unreadable."

# The mail account of `hal check`: the account in one file, the app password in the other. msmtp, run as the operator,
# reads the password at send time; songmaker may read the same files later. Created by hand, so the wizard only names them.
[[secret]]
name = "smtp/password"
kind = "token"
paths = ["~/.secrets/smtp/password"]
read_by = ["hal check"]
recreate = "Create a new app password at the mail provider, revoke the old one, replace the file and update the copy in songmaker/.env by hand"
purpose = "msmtp reads it when hal check sends its mail; the file holds only the password."

[[secret]]
name = "smtp/account.toml"
kind = "configuration"
paths = ["~/.secrets/smtp/account.toml"]
read_by = ["hal check"]
recreate = "Create it by hand: host, port, user and to as TOML, never the password"
purpose = "Account for the mail of hal check (server, port, sender, recipient); without it hal check sends no mail."

[[secret]]
name = "gitlab"
kind = "token"
paths = ["~/.secrets/gitlab"]
read_by = [".bashrc"]
recreate = "https://code.siemens.com/-/user_settings/personal_access_tokens"

[[secret]]
name = "sonarcloud/token"
kind = "token"
paths = ["~/.secrets/sonarcloud/token"]
read_by = ["SONAR_TOKEN in overnightworks/songmaker (CI)"]
recreate = "https://sonarcloud.io/account/security"

[[secret]]
name = "claudebot.env"
kind = "token"
paths = ["~/.secrets/claudebot.env"]
read_by = ["agent-telegram.service"]
recreate = "BotFather /revoke, then a new token: https://t.me/BotFather"

# Not a secret, ruled as decision U5 in overnightworks/home-tools#10; like secrets/README optional, so its absence is no finding.
[[secret]]
name = "claudebot-runtime.env"
kind = "configuration"
paths = ["~/.secrets/claudebot-runtime.env"]
read_by = ["agent-telegram.service"]
recreate = "create ~/.secrets/claudebot-runtime.env, keys as in ~/git/claudebot/README.md (no secret)"
optional = true

[[secret]]
name = "secrets/README"
kind = "documentation"
paths = ["~/.secrets/README"]
read_by = []
recreate = "create ~/.secrets/README: one line per file saying what it is (no secret)"
optional = true

[[secret]]
name = "cloudflared"
kind = "tool-login"
paths = ["~/.secrets/cloudflared/cert.pem"]
read_by = ["cloudflared tunnel (management)"]
recreate = "`cloudflared tunnel login` in the browser"
elsewhere = "tunnel config and credentials file of the running tunnel: /etc/cloudflared (root)"

[[secret]]
name = "cloudflared/tunnel"
kind = "tool-login"
paths = ["~/.secrets/cloudflared/{tunnel_id}.json"]
read_by = ["cloudflared tunnel run (by hand; credentials-file in /etc/cloudflared/config.yml)"]
recreate = "`cloudflared tunnel create` (new tunnel) or copy the file from /etc/cloudflared"
elsewhere = "/etc/cloudflared (root), the copy the running tunnel reads via LoadCredential"

[[secret]]
name = "gmail-cleanup"
kind = "token"
paths = ["~/.secrets/gmail-cleanup/*"]
read_by = ["git/gmail-cleanup"]
recreate = "OAuth client: https://console.cloud.google.com/apis/credentials, then consent in the browser"

[[secret]]
name = "ssh/id_ed25519"
kind = "tool-login"
paths = ["~/.ssh/id_ed25519"]
read_by = ["ssh", "git"]
recreate = "`ssh-keygen -t ed25519`, register the public key: https://github.com/settings/keys"

[[secret]]
name = "ssh/id_ed25519.ppk"
kind = "derived-mirror"
paths = ["~/.ssh/id_ed25519.ppk"]
read_by = ["ssh", "git"]
recreate = "`puttygen ~/.ssh/id_ed25519 -o ~/.ssh/id_ed25519.ppk`"
mirror_of = "ssh/id_ed25519"
optional = true

[[secret]]
name = "gh"
kind = "tool-login"
paths = ["~/.config/gh"]
read_by = ["gh"]
recreate = "`gh auth login --web`"
verify = "gh auth status"

[[secret]]
name = "claude"
kind = "tool-login"
paths = ["~/.claude"]
read_by = ["claude"]
recreate = "`claude`, then /login in the browser"

[[secret]]
name = "claude-measure-token"
kind = "token"
paths = ["~/.secrets/claude-measure-token"]
read_by = ["agent-runtime#115, measurement runs 0b2/0e"]
recreate = "`claude setup-token` in the browser"
purpose = "The measurement runs start Claude with it under their own revocable login."
optional = true

[[secret]]
name = "codex"
kind = "tool-login"
paths = ["~/.codex"]
read_by = ["codex"]
recreate = "`codex login` in the browser"

[[secret]]
name = "songmaker"
kind = "tool-login"
paths = ["~/.songmaker"]
read_by = ["songmaker"]
recreate = "browser login of songmaker"

[[secret]]
name = "github/token"
kind = "token"
paths = ["~/.secrets/github/token"]
read_by = []
recreate = "do not recreate: gh uses its keyring login"
retired_on = 2026-10-14
revoke_url = "https://github.com/settings/tokens"
revocation_confirmed = 2026-10-15

[[secret]]
name = "github/overnightworks-read-token"
kind = "token"
paths = ["~/.secrets/github/overnightworks-read-token"]
read_by = []
recreate = "do not recreate"
retired_on = 2026-10-14
revoke_url = "https://github.com/settings/personal-access-tokens"
revocation_confirmed = 2026-10-15
