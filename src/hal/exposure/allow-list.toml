# Known listeners beyond loopback. Each entry needs `protocol` (tcp or udp), a
# `reason`, and a `port`, an `owner`, or both. `owner` matches the process name,
# or, when it names a unit (`avahi-daemon.service`), only the socket's system
# unit (under system.slice), which ss shows as user and as root, never a
# process named like it: any user can name a process. The script an interpreter runs names a finding but never matches,
# since any process chooses its command line.
# Docker publications are never allow-listed: they must bind 127.0.0.1 or ::1.

[[allow]]
protocol = "udp"
owner = "avahi-daemon.service"
reason = "mDNS: avahi answers local-network service discovery on 5353 and its own random query ports"

[[allow]]
protocol = "udp"
owner = "NetworkManager.service"
port = 546
reason = "DHCPv6 client on the link-local address, the host's own network configuration"

[[allow]]
protocol = "udp"
owner = "cloudflared.service"
reason = "the Cloudflare tunnel's outbound QUIC sockets on random ports; the tunnel is the edge's only way in"

[[allow]]
protocol = "udp"
owner = "chrome"
port = 5353
reason = "Chrome joins the mDNS multicast group 224.0.0.251 to discover cast and local devices"

[[allow]]
protocol = "tcp"
port = 6443
owner = "k3s.service"
reason = "the k3s API server; the platform's k3s binds it to every interface and the host firewall drops inbound traffic from beyond the host"

[[allow]]
protocol = "tcp"
port = 10250
owner = "k3s.service"
reason = "the k3s kubelet; the platform's k3s binds it to every interface and the host firewall drops inbound traffic from beyond the host"

[[allow]]
protocol = "udp"
port = 8472
owner = "k3s.service"
reason = "the flannel VXLAN of k3s; the platform's k3s binds it to every interface and the host firewall drops inbound traffic from beyond the host"
