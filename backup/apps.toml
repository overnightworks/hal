# The apps `hal backup` protects. Each record is validated; there is no hook language.
# Container and volume are found by their compose labels, never by a checkout directory.

[app.songmaker]
compose_project = "songmaker"
db_service = "postgres"
dump = "pg_dump_custom"   # `pg_dump --format=custom` inside the db container
db_user = "songmaker"
db_name = "songmaker"
postgres_major = 16       # the restore test runs a throwaway server of this major
volume = "audiofiles"     # mounted read-only, scanned live (crash-consistent)

[app.songmaker.restore_test]
count_table = "songs"
audio_reference_table = "generations"
audio_reference_column = "mp3_path"  # relative to the audio volume's root

# A DB-only app: no volume, so its snapshot holds the dump and the manifest only.
[app.keycloak]
compose_project = "hal"
db_service = "keycloak-db"
dump = "pg_dump_custom"
db_user = "keycloak"
db_name = "keycloak"
postgres_major = 17       # compose.yaml's keycloak-db

[app.keycloak.restore_test]
count_table = "realm"
require_rows = true   # a Keycloak without a realm is no backup

# LiteLLM's whole database, DB-only: the key hashes, budgets, spend per key and per fingerprint
# with their daily rows, and the tool names.
[app.litellm]
compose_project = "hal"
db_service = "litellm-db"
dump = "pg_dump_custom"
db_user = "litellm"
db_name = "litellm"
postgres_major = 17       # compose.yaml's litellm-db

[app.litellm.restore_test]
count_table = "LiteLLM_VerificationToken"
require_rows = true   # a LiteLLM without a key is no backup

# presentator's SQLite database and its built decks, minus the half-built `staged-*` directories
# of a running build. What the copy holds is in docs/backup.md.
[app.presentator]
compose_project = "presentator"
dump = "sqlite_online_copy"
database_volume = "database"   # presentator's compose.yaml volume of /data/database
database_file = "presentator.sqlite3"
files_volume = "builds"
files_skip = "staged-*"

[app.presentator.restore_test]
count_table = "users"
