[project]
name = "overnightworks-hal"
version = "0.1.0"
description = "hal, the daily door."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6",
    "overnightworks-appkit @ https://github.com/overnightworks/appkit/releases/download/v0.12.1/overnightworks_appkit-0.12.1-py3-none-any.whl#sha256=713041332b779dca028b240cec48ebb4ba4c085c492784dd5046e43d8c284a71",
    "overnightworks-agent-runtime-client @ https://github.com/overnightworks/agent-runtime/releases/download/v0.20.0/overnightworks_agent_runtime_client-0.20.0-py3-none-any.whl#sha256=f43aed7225c13eee56a4597fc5735474e229489fade57aa42da482b70443601e",
]

[project.scripts]
hal = "hal.cli:main"

[dependency-groups]
dev = [
    "ansible-core==2.21.5",
    "overnightworks-agent-runtime-client[backend]",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hal"

[tool.ruff]
line-length = 100
extend-include = ["keycloak/go-live", "step-ca/init", "agent-service/setup"]

[tool.ruff.per-file-target-version]
# agent-service/setup imports these on CI's system python, which is older than the floor.
"src/hal/output/*.py" = "py312"

[tool.ruff.format]
# home's tree is imported as it is: home-tools#56 / home-tools#45 move its texts.
# Deletion target: home-tools#45, or one mechanical reformat item, whichever lands first.
exclude = ["src/hal/workstation/**", "tests/*workstation*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
external = ["S", "T20"]

[tool.ruff.lint.per-file-ignores]
# Same reason and deletion target as [tool.ruff.format]. E501: home's lines run to 140;
# RUF001: the German strings carry U+203A; I001/RUF009/RUF043/RUF100: single imported lines
# (the last three only in the tests).
"src/hal/workstation/**" = ["E501", "I001", "RUF001"]
"tests/*workstation*.py" = ["E501", "I001", "RUF001", "RUF009", "RUF043", "RUF100"]

[tool.coverage.run]
branch = true
# Measures the Python children the tests start (hal's console script), as pytest-cov 7 no longer does.
patch = ["subprocess"]

# No fail_under: edge is not at 100 %. home's floor is per path, in CI's check job.
[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
pythonpath = ["src", "scripts"]

# hal's door modules sit above the stack, the backup runner and the workstation tool, which
# stand apart; the exposure check sits below the stack, and hal.output, which prints for all of
# them, is the lowest piece. exhaustive: a new module under hal must take its place here.
# The forbidden contract keeps the five from importing the exact module hal (a container's layers
# name only its children); as_packages = false with the ** sources keeps hal.output importable.
[tool.importlinter]
root_packages = ["hal"]

[[tool.importlinter.contracts]]
name = "the door sits above stack, backup and workstation, which sit above exposure and output"
type = "layers"
containers = ["hal"]
layers = [
    "alarm_commands : backup_commands : check_commands : cli : config : expire_commands : exposure_rows : grammar : legal_commands : litellm_expiry : migrate_commands : rename_commands : rename_rows : secrets_commands : secrets_rows : setup_commands : stack_commands : version",
    "stack | backup | workstation",
    "exposure",
    "output",
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "hal.backup, hal.exposure and hal.workstation stand apart"
type = "independence"
modules = ["hal.backup", "hal.exposure", "hal.workstation"]

[[tool.importlinter.contracts]]
name = "the five packages never import the hal root module"
type = "forbidden"
source_modules = [
    "hal.stack", "hal.stack.**",
    "hal.backup", "hal.backup.**",
    "hal.exposure", "hal.exposure.**",
    "hal.output", "hal.output.**",
    "hal.workstation", "hal.workstation.**",
]
forbidden_modules = ["hal"]
as_packages = false
