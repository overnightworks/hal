rule = "script-name"
reason = "the operator runs it by this name (docs/internal-ca.md)"

[[layout.allow]]
path = "external/tofurc"
rule = "file-suffix"
reason = "hal's tofu wrapper passes it by this name as TF_CLI_CONFIG_FILE"

[[compose.allow]]
file = "compose.yaml"
service = "traefik"
reason = "it binds the loopback entrypoints of traefik.yml in the host's own namespace, 127.0.0.1:8081 for the tunnel and 127.0.0.1:8090 for this PC"

[[compose.allow]]
file = "probe/agent-service/compose.probe.yaml"
service = "capture-host"
reason = "it captures in the host's own network namespace, loopback included"
