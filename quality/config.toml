[gate]
mandatory_jobs = ["check", "front"]
legacy = "fail"

[[root.allow]]
entry = "fleet.yaml"
reason = "the fleet declaration that the edge tools read at the repository root"

[[root.allow]]
entry = "traefik-mcp.yml"
reason = "static configuration of traefik-mcp, bind-mounted by compose.yaml"

[[root.allow]]
entry = "traefik.yml"
reason = "static configuration of traefik, bind-mounted by compose.yaml"

[[root.allow]]
entry = "agent-service/"
reason = "the agent service's LiteLLM and egress files that compose.yaml mounts, its service.toml and its live canaries"

[[root.allow]]
entry = "backup/"
reason = "backup app declarations that the backup units read"

[[root.allow]]
entry = "bin/"
reason = "the hal launcher"

[[root.allow]]
entry = "dynamic/"
reason = "traefik's dynamic configuration directory, bind-mounted by compose.yaml"

[[root.allow]]
entry = "external/"
reason = "terraform for the external Cloudflare zone"

[[root.allow]]
entry = "keycloak/"
reason = "keycloak's bootstrap and entrypoint files, bind-mounted by compose.yaml"

[[root.allow]]
entry = "legal/"
reason = "the legal pages served at the apex, bind-mounted by compose.yaml"

[[root.allow]]
entry = "mcp/"
reason = "the MCP traefik's dynamic configuration, bind-mounted by compose.yaml"

[[root.allow]]
