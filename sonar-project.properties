sonar.organization=overnightworks
sonar.projectKey=overnightworks_hal
sonar.sources=src,scripts,keycloak/secret-check,agent-service,probe/agent-service,probe/backup,probe/keycloak,probe/step-ca,probe/switches,probe/edge_copy.py,probe/edge_subnets.py,probe/speech
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# The step-ca and switches probes drive a live docker compose stack (proofs 1-5 of #38, probe
# cells 1-7 of #61), and edge_copy.py is their shared helper; they are indexed for issues but
# cannot run under the unit-test coverage job. The Keycloak probe's harness (teardown, signals,
# hold, cookies) is unit-tested by tests/test_keycloak_probe.py, which CI still runs. Its proof
# methods assert against a live Keycloak; testing them against a fake one would only restate the
# assertion, so that route was judged counterproductive and the probe run is their proof.
# test_rp.py runs inside the probe's relying-party container. Sonar cannot exclude single
# methods, so the whole folder is excluded and gating new harness lines on coverage is given up.
# The agent service's image, agent-network helpers, capture and LiteLLM probes
# are live drivers proven by probe runs; capture.py and fake_anthropic.py run inside their containers.
# Coverage is given up for them, as for the other probes.
# The backup retention probe drives hal and the pinned restic image against Postgres containers it
# starts (#969 P1-P8), and the SQLite live-restore probe drives hal and the pinned sqlite image
# against a scratch volume it creates; each is a live driver proven by its probe run, as the
# step-ca and switches ones.
# The speech probe's cells, origin, app resolution and docker helpers drive the copy's live stack
# and are proven by its run; its app rule (app_isolation.py) is unit-tested by
# tests/test_probe_subnets.py, which CI measures.
sonar.coverage.exclusions=probe/backup/**,probe/speech/probe.py,probe/speech/network_cells.py,probe/speech/admission_cells.py,probe/speech/speech_docker.py,probe/speech/release_origin.py,probe/step-ca/**,probe/switches/**,probe/keycloak/**,probe/edge_copy.py,probe/agent-service/image.py,probe/agent-service/agent_networks.py,probe/agent-service/scratch_secrets.py,probe/agent-service/capture.py,probe/agent-service/litellm*.py,probe/agent-service/fake_anthropic.py
