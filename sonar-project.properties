sonar.organization=overnightworks
sonar.projectKey=overnightworks_hal
sonar.sources=src,scripts,keycloak/secret-check,agent-service,probe/agent-service,probe/backup,probe/keycloak,probe/step-ca,probe/switches,probe/edge_copy.py
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# The step-ca and switches probes drive a live docker compose stack (proofs 1-5 of #38, probe
# cells 1-7 of #61), and edge_copy.py is their shared helper; they are indexed for issues but
# cannot run under the unit-test coverage job. The Keycloak probe's harness (teardown, signals,
# hold, cookies) is unit-tested by tests/test_keycloak_probe.py, which CI still runs. Its proof
# methods assert against a live Keycloak; testing them against a fake one would only restate the
# assertion, so that route was judged counterproductive and the probe run is their proof.
# test_rp.py runs inside the probe's relying-party container. Sonar cannot exclude single
# methods, so the whole folder is excluded and gating new harness lines on coverage is given up.
# The agent service's image, egress and its agent-network cells, unit, login command, refusals, capture and LiteLLM probes
# are live drivers proven by probe runs; capture.py, app_tools.py and fake_anthropic.py run inside their containers.
# Coverage is given up for them, as for the other probes.
# The backup retention probe drives hal and the pinned restic image against Postgres containers it
# starts (#969 P1-P8); it is a live driver proven by its probe run, as the step-ca and switches ones.
sonar.coverage.exclusions=probe/backup/**,probe/step-ca/**,probe/switches/**,probe/keycloak/**,probe/edge_copy.py,probe/agent-service/image.py,probe/agent-service/egress.py,probe/agent-service/agent_networks.py,probe/agent-service/unit.py,probe/agent-service/issuer.py,probe/agent-service/containment.py,probe/agent-service/fake_app.py,probe/agent-service/cells_12b.py,probe/agent-service/service_log.py,probe/agent-service/census_client.py,probe/agent-service/app_tools.py,probe/agent-service/capture.py,probe/agent-service/refusals.py,probe/agent-service/scratch_secrets.py,probe/agent-service/signer.py,probe/agent-service/litellm*.py,probe/agent-service/fake_anthropic.py
