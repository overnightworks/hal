# Probe overlay (probe/keycloak/probe.py): throwaway secrets and config copies from the probe's
# scratch directory, plus a test relying party that records back-channel logouts. It also moves the
# stack off the live edge's addresses: Traefik's entrypoints (a copy of traefik.yml), the admin
# front end and the trusted subnet (the network itself: probe.py's generated overlay). Never used
# live.
services:
  traefik:
    volumes:
      - ${PROBE_TRAEFIK_CONFIG:?run through probe/keycloak/probe.py}:/etc/traefik/traefik.yml:ro

  keycloak:
    environment:
      KC_HOSTNAME_ADMIN: ${PROBE_ADMIN_URL:?run through probe/keycloak/probe.py}
      KC_PROXY_TRUSTED_ADDRESSES: ${PROBE_KEYCLOAK_SUBNET:?run through probe/keycloak/probe.py}
    labels:
      # The live Traefik routes only a name of lowercase letters, digits and hyphens, so it must
      # not pick this container up and route the public host to it.
      edge.name: PROBE

  keycloak-config-cli:
    environment:
      KC_HOSTNAME_ADMIN: ${PROBE_ADMIN_URL:?run through probe/keycloak/probe.py}
    volumes:
      - ${PROBE_CONFIG_DIR:?run through probe/keycloak/probe.py}:/config:ro

  probe-rp:
    image: python:3.13.17-alpine@sha256:fa0bb0d0cd7c7d6cef30a69094d32ac2b71c7304c87c6107fec100e1ee4eda02
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [keycloak]
    command: ["python", "-u", "/rp/test_rp.py"]
    volumes:
      - ./probe/keycloak/test_rp.py:/rp/test_rp.py:ro

  # A stand-in for songmaker's web service: a container on the back-channel network only.
  probe-backchannel-client:
    image: python:3.13.17-alpine@sha256:fa0bb0d0cd7c7d6cef30a69094d32ac2b71c7304c87c6107fec100e1ee4eda02
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backchannel-songmaker]
    command: ["sleep", "infinity"]
    volumes:
      - ./probe/keycloak/backchannel_client.py:/cell/backchannel_client.py:ro

networks:
  # The project's own copies of the back-channel networks, not the live ones.
  backchannel-songmaker:
    name: ${COMPOSE_PROJECT_NAME}_backchannel_songmaker
  backchannel-hopin:
    name: ${COMPOSE_PROJECT_NAME}_backchannel_hopin
  backchannel-presentator:
    name: ${COMPOSE_PROJECT_NAME}_backchannel_presentator

secrets:
  keycloak_db_password:
    file: ${PROBE_SECRETS_DIR:?run through probe/keycloak/probe.py}/db-password
  keycloak_config_cli_secret:
    file: ${PROBE_SECRETS_DIR}/config-cli-secret
  keycloak_bootstrap_admin_password:
    file: ${PROBE_SECRETS_DIR}/bootstrap-admin-password
  keycloak_client_songmaker:
    file: ${PROBE_SECRETS_DIR}/clients/songmaker
  keycloak_client_hopin:
    file: ${PROBE_SECRETS_DIR}/clients/hopin
  keycloak_client_presentator:
    file: ${PROBE_SECRETS_DIR}/clients/presentator
