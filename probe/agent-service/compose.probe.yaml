# Probe overlay (probe/agent-service/litellm_stack.py), laid over a copy of compose.yaml whose networks
# that pin a /24 (edge_subnets) the probe moved to free /24s, so it never
# collides with the live stack's: the gateway's static file from that copy, and the two
# packet windows. Never used live. The copy also names the fixed networks `<project>_...`
# (edge_copy.namespaced_compose).
services:
  agent-egress:
    volumes:
      # The gateway's static file with its entrypoint addresses moved to the probe subnets; the
      # dynamic directory is the real one.
      - ${PROBE_EGRESS_STATIC:?run through probe/agent-service/litellm_stack.py}:/etc/traefik/traefik.yml:ro

  # The gateway's own namespace: the SYNs that leave it (capture.py syn).
  capture-egress: &capture
    profiles: [litellm]
    # The realm observer's pin (compose.yaml); tests/test_agent_egress.py holds the two equal.
    image: python:3.14.10-alpine@sha256:a18b20ad69e74df6cf6d2e1b1a260d7a1ecf5380fd83b310f83ba88c461cf894
    # Root in the container, but NET_RAW alone: it opens a packet socket and writes nothing.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    network_mode: service:agent-egress
    restart: "no"
    entrypoint: ["python", "-I", "-B", "/probe/capture.py"]
    volumes:
      - ./probe/agent-service/capture.py:/probe/capture.py:ro

  # The host's namespace, every interface including loopback (capture.py dns).
  capture-host:
    <<: *capture
    network_mode: host
