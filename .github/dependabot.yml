version: 2
# One pull for all images, so co-pinned images move together: realm-observer and probe-rp,
# and keycloak-db (compose) with the restic stage restore-17 (Dockerfile).
multi-ecosystem-groups:
  images:
    schedule:
      interval: daily
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: docker-compose
    directories:
      - /
      - /keycloak
      - /probe/agent-service
      - /probe/keycloak
      - /probe/step-ca
    multi-ecosystem-group: images
    patterns: ["*"]
    ignore:
      # A major or minor move of an image (postgres 17 to 18) is a data migration, its own item.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directories:
      - /probe/agent-service
      - /scripts/system-proof
      - /src/hal/backup/images
    multi-ecosystem-group: images
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
