# Static checks, plus one job that starts the pinned front of LiteLLM against a stand-in: the edge
# runs on the operator's host, so the job `check` never starts containers. It proves the compose
# file renders and that the loopback-only, deny-by-default shape holds, and it lints and tests
# overnightworks-hal against fixture outputs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run; a push to main never is.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder the compose file interpolates; the real one lives in the uncommitted .env.
      DOCKER_GID: "127"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: overnightworks-hal installs from the lock file
        run: uv sync --locked --no-build --no-install-project

      # The compose file interpolates the domain: the zone fleet.yaml names, as `hal apply` writes it to .env.
      - name: EDGE_DOMAIN is fleet.yaml's cloudflare.zone
        run: |
          PYTHONPATH=src uv run --no-sync python -c 'from pathlib import Path; from hal.stack import catalog; print("EDGE_DOMAIN=" + catalog.zone(catalog.read(Path("fleet.yaml"))))' >> "$GITHUB_ENV"

      - name: overnightworks-hal lint
        run: |
          uv run --no-sync --no-build ruff check
          uv run --no-sync --no-build ruff format --check

      - name: overnightworks-hal tests
        # pytest and pytest-cov come from the lock file, installed by the sync step above;
        # pyproject.toml's pythonpath makes src and scripts importable.
        run: uv run --no-sync --no-build pytest --cov=src --cov=scripts --cov=probe/agent-service --cov=agent-service --cov-report=xml:coverage.xml

      # home's, hal's and hal.output's floor: edge's own code carries none, so the floor is per path, not a global fail_under.
      # If a home or hal path moves, this include moves with it. hal's console script runs in child
      # processes, which [tool.coverage.run] patch = ["subprocess"] measures.
      - name: home's, hal's and hal.output's code stay at 100 % line and branch coverage
        run: uv run --no-sync --no-build coverage report --include='src/hal/*.py,src/hal/workstation/*,src/hal/output/*' --fail-under=100 --show-missing

      # The quality gate never runs tests; it scans the report this job hands over.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

      # The wheel must ship every package, not only the one the editable install happens to find.
      - name: The wheel installs overnightworks-hal and hal
        run: |
          uv build --wheel --out-dir dist
          uv run --isolated --no-project --no-build --with dist/*.whl hal backup --help
          uv run --isolated --no-project --no-build --with dist/*.whl hal restore --help
          uv run --isolated --no-project --no-build --with dist/*.whl hal check --help
          python3 -m zipfile -l dist/overnightworks_hal-*.whl | grep -F hal/exposure/allow-list.toml
          python3 -m zipfile -l dist/overnightworks_hal-*.whl | grep -F hal/workstation/system/ansible.cfg
          python3 -m zipfile -l dist/overnightworks_hal-*.whl | grep -F hal/workstation/system/callback_plugins/hal_events.py
          scratch=$(mktemp -d)
          mkdir "$scratch/home" "$scratch/work"
          UV_TOOL_DIR="$scratch/tools" UV_TOOL_BIN_DIR="$scratch/bin" uv tool install --no-build "$PWD"/dist/overnightworks_hal-*.whl
          cd "$scratch/work"
          export HOME="$scratch/home" PATH="$scratch/bin:$PATH"
          hal --help
          [ ! -e "$scratch/bin/home" ]
          [ ! -e "$scratch/bin/edge" ]
          hal secrets --help
          hal secrets --by-service | grep -F "declared dependencies"
          version=$(hal version)
          [ "$version" = "no checkout (installed from a wheel)" ]
          rc=0; hal frobnicate >"$scratch/out" 2>"$scratch/err" || rc=$?
          [ "$rc" -eq 2 ]
          [ ! -s "$scratch/out" ]
          head -n 1 "$scratch/err" | grep -q '^error:'
          # docs/naming.md: `hal` must import from the tool's own environment, not from a stray package.
          tool_dir="$scratch/tools/overnightworks-hal"
          for module in hal hal.output; do
            module_file=$("$tool_dir/bin/python" -I -c "import $module; print($module.__file__)")
            case $module_file in "$tool_dir/"*) ;; *) echo "$module imported from $module_file"; exit 1 ;; esac
          done

      - name: Compose renders (default, keycloak, step-ca, probe, agent-service, agent-probe and litellm profiles, Keycloak bootstrap and probe overlays)
        run: |
          docker compose config -q
          docker compose --profile keycloak config -q
          docker compose --profile step-ca config -q
          docker compose --profile probe config -q
          docker compose --profile agent-service config -q
          docker compose --profile agent-probe config -q
          docker compose --profile litellm config -q
          docker compose --profile litellm config --services | grep -x litellm
          docker compose --profile litellm config --services | grep -x litellm-front
          docker compose --profile agent-service config --services | grep -x agent-egress
          docker compose --profile agent-probe config --services | grep -x agent-probe
          docker compose --profile step-ca config --services | grep -x step-ca
          docker compose --profile step-ca config --services | grep -x traefik-mcp
          docker compose --profile step-ca config --services | grep -x traefik-mcp-acme-owner
          if docker compose config --services | grep -xE 'keycloak|keycloak-db'; then exit 1; fi
          docker compose --profile keycloak config --services | grep -x keycloak
          docker compose --profile keycloak config --services | grep -x keycloak-db
          docker compose --profile keycloak --profile apply config --services | grep -x realm-observer
          docker compose --file compose.yaml --file keycloak/bootstrap.compose.yaml \
            --profile keycloak --profile apply config -q
          PROBE_SECRETS_DIR=/nonexistent PROBE_CONFIG_DIR=/nonexistent \
            PROBE_TRAEFIK_CONFIG=/nonexistent \
            PROBE_ADMIN_URL=http://localhost:1 PROBE_KEYCLOAK_SUBNET=172.31.200.0/24 \
            docker compose --file compose.yaml --file keycloak/bootstrap.compose.yaml \
            --file probe/keycloak/compose.probe.yaml --profile keycloak --profile apply config -q
          PROBE_CA_JSON=/nonexistent docker compose --file compose.yaml \
            --file probe/step-ca/compose.probe.yaml --profile probe --profile step-ca config -q
          PROBE_EGRESS_STATIC=/nonexistent docker compose --file compose.yaml \
            --file probe/agent-service/compose.probe.yaml \
            --profile agent-service --profile agent-probe config -q

      - name: YAML files parse
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' \
            traefik.yml keycloak/master.yaml keycloak/realm.yaml \
            keycloak/bootstrap.compose.yaml probe/keycloak/compose.probe.yaml probe/step-ca/compose.probe.yaml step-ca/ca.json \
            traefik-mcp.yml mcp/dynamic/* agent-service/egress/traefik.yml agent-service/egress/dynamic/* \
            agent-service/litellm/config.yaml agent-service/litellm/front/traefik.yml \
            agent-service/litellm/front/dynamic/*

      # Traefik listens on loopback only: the tunnel entrypoint 8081 and the local Keycloak admin
      # entrypoint 8090, and nothing implicit. A router that names no entrypoint binds only `edge`,
      # and each Keycloak router names its own.
      - name: No published ports, Traefik listens on 8081 and 8090 only, routers bind as declared
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          compose = open("compose.yaml").read()
          if re.search(r"^\s*ports:", compose, re.M) or "0.0.0.0" in compose:
              sys.exit("compose.yaml publishes ports or binds 0.0.0.0")
          traefik = yaml.safe_load(open("traefik.yml"))
          forbidden = {"api", "ping", "metrics"} & set(traefik)
          if forbidden:
              sys.exit(f"traefik.yml enables {sorted(forbidden)}")
          addresses = sorted(e["address"] for e in traefik["entryPoints"].values())
          if addresses != ["127.0.0.1:8081", "127.0.0.1:8090"]:
              sys.exit(f"traefik.yml listens on {addresses}")
          flags = {n: e.get("asDefault", False) for n, e in traefik["entryPoints"].items()}
          not_boolean = sorted(n for n, flag in flags.items() if not isinstance(flag, bool))
          if not_boolean:
              sys.exit(f"asDefault is not a boolean on {not_boolean}")
          defaults = sorted(n for n, flag in flags.items() if flag)
          if defaults != ["edge"]:
              sys.exit(f"the default entrypoints are {defaults}, not exactly edge")
          bindings = {}
          for service_name, service in yaml.safe_load(compose)["services"].items():
              labels = service.get("labels") or {}
              routers = {k.split(".")[3] for k in labels if k.startswith("traefik.http.routers.")}
              for router in routers:
                  entrypoints = labels.get(f"traefik.http.routers.{router}.entrypoints")
                  bindings.setdefault(router, []).append((service_name, entrypoints))
          shared = sorted(r for r, owners in bindings.items() if len(owners) > 1)
          if shared:
              sys.exit(f"routers defined by more than one service: {shared}")
          unnamed = sorted(r for r, [(_, entrypoints)] in bindings.items() if not entrypoints)
          if unnamed:
              sys.exit(f"routers without an entrypoint: {unnamed}")
          for router, entrypoint in {"auth": "edge", "auth-admin": "admin"}.items():
              owner = bindings.get(router, [(None, None)])[0]
              if owner != ("keycloak", entrypoint):
                  sys.exit(f"router {router} is {owner}, not keycloak on {entrypoint}")
          PY

      # step-ca sits on the internal network mcp-ca alone, so its network, hardening and password
      # channel are pinned here rather than left to the port checks above.
      - name: step-ca is pinned, hardened and takes its password from /run/secrets
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          compose = open("compose.yaml").read()
          step_ca = yaml.safe_load(compose)["services"]["step-ca"]
          if not re.search(r"@sha256:[0-9a-f]{64}$", step_ca["image"]):
              sys.exit("the step-ca image is not pinned by digest")
          hardening = (step_ca.get("read_only"), step_ca.get("cap_drop"))
          if hardening != (True, ["ALL"]) or "no-new-privileges:true" not in step_ca["security_opt"]:
              sys.exit(f"step-ca is not read_only, cap_drop ALL, no-new-privileges: {hardening}")
          if step_ca.get("networks") != ["mcp-ca"] or "network_mode" in step_ca:
              sys.exit(f"step-ca is not on mcp-ca alone: {step_ca.get('networks')} {step_ca.get('network_mode')}")
          if yaml.safe_load(compose)["networks"]["mcp-ca"].get("internal") is not True:
              sys.exit("the network mcp-ca is not internal")
          if "--insecure" in step_ca["command"] or any(a.startswith("--acme-tls-port") for a in step_ca["command"]):
              sys.exit("step-ca keeps its default challenge port 443")
          if step_ca.get("cap_add", []) != ["NET_BIND_SERVICE"]:
              sys.exit(f"step-ca cap_add is not exactly [NET_BIND_SERVICE]: {step_ca.get('cap_add')}")
          if "DOCKER_STEPCA_INIT" in compose or "environment" in step_ca:
              sys.exit("step-ca takes its password from /run/secrets only, never from the environment")
          if "--password-file=/run/secrets/step_ca_password" not in step_ca["command"]:
              sys.exit("step-ca does not read its password from /run/secrets")
          if "./step-ca/ca.json:/etc/step-ca/ca.json:ro" not in step_ca["volumes"]:
              sys.exit("step-ca/ca.json is not mounted read-only")
          PY

      # The realm observer holds the config-cli secret and reads both realms (#66), so its door
      # is pinned here: the probe's python image, hardening, the keycloak network alone, no
      # depends_on, the secret as a file and observe.py mounted read-only.
      - name: realm-observer is pinned like the probe, hardened and starts nothing
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          observer = yaml.safe_load(open("compose.yaml"))["services"]["realm-observer"]
          probe_rp = yaml.safe_load(open("probe/keycloak/compose.probe.yaml"))["services"]["probe-rp"]
          if not re.search(r"@sha256:[0-9a-f]{64}$", observer["image"]):
              sys.exit("the realm-observer image is not pinned by digest")
          if observer["image"] != probe_rp["image"]:
              sys.exit(f"realm-observer {observer['image']} is not the probe's {probe_rp['image']}")
          hardening = (observer.get("user"), observer.get("read_only"), observer.get("cap_drop"))
          if hardening != ("65534:65534", True, ["ALL"]):
              sys.exit(f"realm-observer is not 65534, read_only, cap_drop ALL: {hardening}")
          if observer.get("security_opt") != ["no-new-privileges:true"] or "cap_add" in observer:
              sys.exit("realm-observer is not exactly no-new-privileges without cap_add")
          if observer.get("networks") != ["keycloak"] or "network_mode" in observer or "ports" in observer:
              sys.exit(f"realm-observer is not on keycloak alone without ports: {observer.get('networks')}")
          if observer.get("profiles") != ["apply"] or "depends_on" in observer:
              sys.exit("realm-observer is not in the apply profile alone, or depends on a service")
          if observer.get("secrets") != [{"source": "keycloak_config_cli_secret", "target": "config_cli_secret"}]:
              sys.exit(f"realm-observer's secret is not the config-cli secret file: {observer.get('secrets')}")
          if observer.get("volumes") != ["./src/hal/stack/realm/observe.py:/opt/observer/observe.py:ro"]:
              sys.exit(f"realm-observer mounts more than observe.py read-only: {observer.get('volumes')}")
          if observer.get("environment") != {"PYTHONDONTWRITEBYTECODE": "1"}:
              sys.exit(f"realm-observer's environment is not exactly PYTHONDONTWRITEBYTECODE: {observer.get('environment')}")
          if observer["entrypoint"][:3] != ["python", "-I", "-B"]:
              sys.exit(f"realm-observer does not run python -I -B: {observer['entrypoint']}")
          PY

      # traefik-mcp has no host listener: it sits on the four internal MCP networks and nowhere
      # else, sets the sysctl that lets uid 65534 bind 443, and copies traefik.yml's global, log and
      # hardening blocks, so the two Traefiks cannot drift apart. The address check above stays
      # as it is.
      - name: traefik-mcp has no host networking, exactly the four MCP networks and the 443 sysctl
        run: |
          python3 - <<'PY'
          import sys, yaml
          compose = yaml.safe_load(open("compose.yaml"))
          mcp = compose["services"]["traefik-mcp"]
          if "network_mode" in mcp or "ports" in mcp:
              sys.exit("traefik-mcp has host networking or published ports")
          if sorted(mcp["networks"]) != ["mcp", "mcp-backends", "mcp-ca", "mcp-songmaker"]:
              sys.exit(f"traefik-mcp is on {sorted(mcp['networks'])}")
          if mcp.get("sysctls") != {"net.ipv4.ip_unprivileged_port_start": 0}:
              sys.exit(f"traefik-mcp sysctls are {mcp.get('sysctls')}")
          public = yaml.safe_load(open("traefik.yml"))
          internal = yaml.safe_load(open("traefik-mcp.yml"))
          for block in ("global", "log"):
              if public[block] != internal[block]:
                  sys.exit(f"traefik-mcp.yml's {block} differs from traefik.yml's")
          hardening = dict(internal["entryPoints"]["mcp"]["http"])
          hardening.pop("tls")
          if hardening != public["entryPoints"]["edge"]["http"]:
              sys.exit("traefik-mcp.yml's hardening block differs from traefik.yml's")
          PY

      # litellm-front is the same Traefik as the public one with one entrypoint on :4000: its http
      # block is the public entrypoint's, and its global and log blocks are the public ones.
      - name: litellm-front keeps the public Traefik's hardening and reads no secret
        run: |
          python3 - <<'PY'
          import sys, yaml
          compose = yaml.safe_load(open("compose.yaml"))
          front = compose["services"]["litellm-front"]
          if "secrets" in front or "ports" in front or "network_mode" in front:
              sys.exit("litellm-front reads a secret, publishes a port or has host networking")
          if sorted(front["networks"]) != ["litellm-api", "litellm-backend"]:
              sys.exit(f"litellm-front is on {sorted(front['networks'])}")
          public = yaml.safe_load(open("traefik.yml"))
          static = yaml.safe_load(open("agent-service/litellm/front/traefik.yml"))
          for block in ("global", "log"):
              if public[block] != static[block]:
                  sys.exit(f"the front's {block} differs from traefik.yml's")
          if static["entryPoints"]["api"]["http"] != public["entryPoints"]["edge"]["http"]:
              sys.exit("the front's hardening block differs from traefik.yml's")
          PY

      # OpenTofu runs on the operator's host (the wrapper is X1b); CI installs the same version that
      # external/main.tf pins (tofu_test checks it) and the action verifies the download's sha256.
      # The wrapper is off: later steps read tofu's raw output and exit code.
      - name: Install pinned tofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: "#32 X1a rule 1: OpenTofu root is formatted, pinned by the lock file and valid"
        working-directory: external
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -lockfile=readonly
          tofu validate

      # One planted home for rules 2 and 3, so the two proofs cannot drift apart.
      - name: Plant a home with a dev_overrides ~/.tofurc
        run: |
          fake_home=$(mktemp -d -p "$RUNNER_TEMP")
          mkdir "$fake_home/override"
          cat > "$fake_home/.tofurc" <<RC
          provider_installation {
            dev_overrides {
              "cloudflare/cloudflare" ="$fake_home/override"
            }
            direct {}
          }
          RC
          echo "FAKE_HOME=$fake_home" >> "$GITHUB_ENV"

      # With enforced encryption neither the state nor the plan file may carry a sentinel in plaintext.
      # Matrix per home (clean, and with a planted ~/.tofurc under the wrapper's TF_CLI_CONFIG_FILE):
      # with the passphrase both artifacts show the sentinel; without it neither can be read, planned or applied;
      # a wrong passphrase fails too, so the failure comes from decryption and not from the missing variable.
      - name: "#32 X1a rule 2: OpenTofu state and plan files are encrypted"
        run: |
          set -euo pipefail
          must_fail() { if "$@"; then echo "unexpectedly succeeded: $*" >&2; exit 1; fi; }
          sentinel=SENTINEL-plaintext-marker
          fake_home=$FAKE_HOME
          guard="$PWD/external/tofurc"
          prove_encryption() {
            local scenario=$1 work
            work=$(mktemp -d)
            cp external/main.tf external/.terraform.lock.hcl fleet.yaml "$work/"
            mkdir "$work/external" && mv "$work/main.tf" "$work/.terraform.lock.hcl" "$work/external/"
            (
              cd "$work/external"
              printf 'resource "terraform_data" "sentinel" {\n  input = "%s"\n}\n' "$sentinel" > sentinel.tf
              export TF_VAR_state_passphrase=throwaway-test-passphrase
              tofu init -input=false -lockfile=readonly -backend-config=path="$work/test.tfstate"
              tofu apply -input=false -auto-approve
              grep -q encrypted_data "$work/test.tfstate"
              must_fail grep -q "$sentinel" "$work/test.tfstate"
              tofu plan -input=false -out=p.tfplan
              must_fail grep -aq "$sentinel" p.tfplan
              must_fail unzip -tq p.tfplan
              tofu show -json p.tfplan | grep -q "$sentinel"
              tofu show -json | grep -q "$sentinel"
              TF_VAR_state_passphrase=a-different-wrong-passphrase must_fail tofu show -json p.tfplan
              TF_VAR_state_passphrase=a-different-wrong-passphrase must_fail tofu show -json
              unset TF_VAR_state_passphrase
              must_fail tofu show -json p.tfplan
              must_fail tofu show -json
              must_fail tofu plan -input=false
            )
            echo "ENCRYPTION-PROVEN ($scenario)"
          }
          # A plaintext fallback on one target (state or plan) makes plaintext readable there unless
          # `enforced = true` forbids it. A single method already rejects plaintext, so only this case
          # turns red when the flag is dropped from that target.
          prove_plaintext_refused() {
            local target=$1 work
            work=$(mktemp -d)
            cp external/main.tf external/.terraform.lock.hcl fleet.yaml "$work/"
            mkdir "$work/external" && mv "$work/main.tf" "$work/.terraform.lock.hcl" "$work/external/"
            (
              cd "$work/external"
              export TF_VAR_state_passphrase=throwaway-test-passphrase
              printf 'resource "terraform_data" "sentinel" {\n  input = "%s"\n}\n' "$sentinel" > sentinel.tf
              cp main.tf encrypted.tf.orig
              sed -i '/^  encryption {$/,/^  }$/d' main.tf
              tofu init -input=false -lockfile=readonly -backend-config=path="$work/test.tfstate"
              tofu apply -input=false -auto-approve
              tofu plan -input=false -out=p.tfplan
              grep -aq "$sentinel" "$work/test.tfstate"
              mv encrypted.tf.orig main.tf
              sed -i -e "/^    $target {\$/,/^    }\$/ s/^\( *\)method   = method.aes_gcm.fleet\$/&\n\1fallback {\n\1  method = method.unencrypted.plain\n\1}/" \
                     -e 's/^    state {$/    method "unencrypted" "plain" {}\n\n    state {/' main.tf
              grep -c 'method.unencrypted.plain' main.tf | grep -qx 1
              if [ "$target" = state ]; then must_fail tofu show -json; else must_fail tofu show -json p.tfplan; fi
            )
            echo "PLAINTEXT-REFUSED ($target)"
          }
          unset TF_CLI_CONFIG_FILE
          prove_encryption "home override absent"
          HOME="$fake_home" TF_CLI_CONFIG_FILE="$guard" prove_encryption "home override present"
          prove_plaintext_refused state
          prove_plaintext_refused plan

      # The wrapper passes external/tofurc as TF_CLI_CONFIG_FILE; a planted ~/.tofurc must not swap a provider.
      - name: "#32 X1a rule 3: A home-directory dev_overrides cannot swap a provider"
        run: |
          set -euo pipefail
          fake_home=$FAKE_HOME
          cd external
          rm -rf .terraform
          HOME="$fake_home" tofu init -no-color -backend=false -lockfile=readonly > "$fake_home/planted.txt" 2>&1 || true
          grep -qi "development overrides" "$fake_home/planted.txt"
          rm -rf .terraform
          HOME="$fake_home" TF_CLI_CONFIG_FILE="$PWD/tofurc" tofu init -no-color -backend=false -lockfile=readonly > "$fake_home/guarded.txt" 2>&1
          if grep -qi "development overrides" "$fake_home/guarded.txt"; then echo "override leaked" >&2; exit 1; fi
          grep -q "successfully initialized" "$fake_home/guarded.txt"
          echo OVERRIDE-BLOCKED

      # The one tofu test entry point: the tofu installed above, an exact environment, mocked providers.
      - name: "#123 X1d: the OpenTofu tests run through edge's entry point"
        run: PYTHONPATH=src uv run --no-sync python -m hal.stack.external.tofu_test

      # The quality gate scans the history for literal-looking secrets; the structural rule (a
      # literal in keycloak/*.yaml or any compose file, in block, flow or list style) reads the parsed YAML.
      # tests/test_secret_check.py plants each style, so a check that stops matching turns it red.
      - name: No secret in any file
        run: |
          uv run --locked --no-build --script keycloak/secret-check/secret_check.py .

  # The pinned front of LiteLLM as shipped, against a stand-in backend: the table of
  # tests/test_litellm_front.py (about 50 MB of images). It re-runs on every Traefik bump.
  front:
    runs-on: ubuntu-latest
    env:
      DOCKER_GID: "127"
      EDGE_FRONT_CASES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: overnightworks-hal installs from the lock file
        run: uv sync --locked --no-build --no-install-project

