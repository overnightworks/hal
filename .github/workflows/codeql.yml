name: CodeQL

on:
  # Dependabot-triggered runs get a read-only token, but code scanning always
  # accepts uploads from pull_request runs, so Dependabot PRs get an analysis.
  # Avoid pull_request_target: executing untrusted PR code there can expose a privileged token.
  # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/resource-not-accessible
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@07bdf7c478ac9cc9cd348b180abd3cbc9d873f23  # v0.9.2
    with:
      languages: '["actions", "python"]'
