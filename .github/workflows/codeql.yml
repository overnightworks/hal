name: CodeQL

on:
  # Dependabot-triggered runs get a read-only token, but code scanning always
  # accepts uploads from pull_request runs, so Dependabot PRs get an analysis.
  # Avoid pull_request_target: executing untrusted PR code there can expose a privileged token.
  # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/resource-not-accessible
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run; a run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

jobs:
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/codeql.yml@9ced0f5cee689f2c70fb1467513b943484bd65a5  # v0.11.1
    with:
      languages: '["actions", "python"]'
