cloudflare:
  zone: hallucinai.de
  redirect:
    hosts: ["@", www]
    target: "https://auth.hallucinai.de/"
    # /favicon.ico is the browser's automatic request: it must be answered here, not redirected to auth.
    serve:
      pages: [/impressum, /datenschutz, /nutzungsbedingungen, /favicon.ico]
      files: /_rechtliches/

github:
  org: overnightworks

services:
  songmaker:
    hosts:
      - {name: songmaker, exposure: public, reason: "songmaker is public with its own login", target: "http://localhost:8080", deny_public: [/auth/backchannel-logout, /metrics]}
  hopin:
    hosts:
      - {name: hopin, exposure: public, reason: "video calls; every page needs the Keycloak login (hopin#25)", tunnel: platform, ready: /health, deny_public: [/auth/backchannel-logout]}
  skat:
    hosts:
      - {name: skat, exposure: public, reason: "skat is public behind its own Keycloak login", tunnel: platform, ready: /health, deny_public: [/auth/backchannel-logout]}
  presentator:
    repo: {default_branch: main}
    run: {enabled: true}
    hosts:
      - {name: presentator, exposure: public, reason: "presentator is public behind its own Keycloak login", ready: /health, deny_public: [/auth/backchannel-logout]}
      - {name: presentator-talk, exposure: public, reason: "the talk app has its own webauth (presentator ADR 0016)", ready: /health, deny_public: [/auth/backchannel-logout]}
  speech-runtime:
    repo: {default_branch: main}
    run: {enabled: true}
  step-ca:
    run:
      enabled: true
      setup: step-ca/init
  legal:
    run:
      enabled: true
    hosts:
      - {name: "@", exposure: public, reason: "static legal pages without a login", ready: /impressum}
  litellm:
    run:
      enabled: true
  keycloak:
    run:
      enabled: true
      setup: keycloak/go-live
    hosts:
      - {name: auth, exposure: public, reason: "Keycloak's pages are public; its login protects them", ready: /realms/hallucinai/.well-known/openid-configuration}
