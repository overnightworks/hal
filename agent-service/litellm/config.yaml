# LiteLLM's configuration (compose.yaml, service `litellm`). Three text names an app sends, each
# mapped to the current id of its family on Anthropic, with `max_tokens`: what LiteLLM sends for a
# request that names none, and the output it reserves against a budget, so the ceiling of a
# conforming app; an app that names more is bound by the budgets alone. One picture name, mapped
# to an OpenAI image model, which answers with the picture's bytes and its usage; it has no
# `max_tokens`, so nothing is reserved and one picture can pass a budget. A change reaches LiteLLM
# only through a recreate of the container. No callback, cache or fallback; the provider keys, the
# master key and the database URL come from the environment start.sh fills from their files.
# LiteLLM's own keys decide who may call: each app holds one, with its models, its routes, its
# money budget and its bound on parallel requests. Every request names its person as `user`, whose
# spend the budget `max_end_user_budget_id` bounds unless the person's own row links another. The
# database holds keys, budgets and each person's fingerprint with its counters, and one spend log
# row per call, failures included, with key hash, person, model, cost, status and a failure's
# reason, never its prompt or answer; LiteLLM deletes a row after 30 days. Message logging follows
# the log depth compose.yaml passes in. No app knows the master key, so the admin routes
# stay closed to apps.
model_list:
  - model_name: text/opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_retries: 0
      max_tokens: 16384
  - model_name: text/sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_retries: 0
      max_tokens: 16384
  - model_name: text/haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_retries: 0
      max_tokens: 16384
  - model_name: image/flare
    litellm_params:
      model: openai/gpt-image-2.5-flare
      api_key: os.environ/OPENAI_API_KEY
      max_retries: 0

router_settings:
  num_retries: 0

litellm_settings:
  turn_off_message_logging: os.environ/HAL_TURN_OFF_MESSAGE_LOGGING
  redact_messages_in_exceptions: true
  max_end_user_budget_id: person-monthly
  # No request tag comes from the user agent, so a conforming request writes no daily tag row.
  disable_add_user_agent_to_request_tags: true

general_settings:
  enforce_user_param: true
  disable_spend_logs: false
  # A failure's spend log row: LiteLLM writes none while this is true.
  disable_error_logs: false
  store_prompts_in_spend_logs: false
  maximum_spend_logs_retention_period: 30d
