# The hallucinai realm: the one login for the apps. Applied by `hal apply` through keycloak-config-cli (docs/keycloak.md, "Start and apply").
# People and memberships are managed in the admin console, never here. The apply adds and changes
# and deletes no undeclared top-level object and no person (IMPORT_MANAGED_* is no-delete in compose.yaml);
# a console addition inside an object declared here is reset with it. Removing or renaming a group
# below leaves the old group and its memberships in Keycloak, and so does a subgroup the console
# made under /apps or /services. What this file declares belongs to it: a console change to a
# declared object (a flow step, a mapper, a client's scope list, a service account's client role,
# a flow binding override) is reset on the next apply that runs the realm step. The blockquote in docs/keycloak.md after "Theme and
# language" states that class with its measured examples; change a declared object here.
# Deleting anything is done in the admin console, after a backup.
# The songmaker, hopin and presentator clients are here before the go-live; the other app clients
# arrive with each app's cutover, together with its live redirect and logout URLs.
realm: hallucinai
enabled: true
# The pages' look lives in the theme files (keycloak/themes/hallucinai), so changing it is no realm change.
loginTheme: hallucinai
accountTheme: hallucinai
# German and English, the browser decides, English when neither is asked for.
internationalizationEnabled: true
supportedLocales: [de, en]
defaultLocale: en
accessTokenLifespan: 300          # 5 minutes
ssoSessionMaxLifespan: 2592000    # 30 days
ssoSessionIdleTimeout: 604800     # 7 days
bruteForceProtected: true
# Passkeys are offered to every user and bound to the apex domain, so every app subdomain shares them.
webAuthnPolicyRpId: hallucinai.de
webAuthnPolicyPasswordlessRpId: hallucinai.de
webAuthnPolicyPasswordlessPasskeysEnabled: true
eventsEnabled: true
eventsExpiration: 7776000         # login events: 90 days
enabledEventTypes: [LOGIN, LOGIN_ERROR]   # no other user event type is stored
adminEventsEnabled: true
attributes:
  adminEventsExpiration: "31536000"   # admin events: 1 year
roles:
  realm:
    - name: agent-workload
      description: Service-account-only marker of an app workload calling the agent service.
    - name: speech-workload
      description: Service-account-only marker of an app workload calling the speech service.
groups:
  - name: apps
    subGroups:
      - name: songmaker
        subGroups:
          - name: admin
      - name: presentator
        subGroups:
          - name: admin
      - name: hopin
        subGroups:
          # hopin's admin role, by webauth's group rule (/apps/<app>/admin means admin).
          - name: admin
  - name: services
    subGroups:
      - name: agent-service
        subGroups:
          # The agent service's subscription right; it reads this path through its service.toml.
          - name: subscription
          # The paid LiteLLM right; nothing reads it until the paid route exists.
          - name: api
      # Exactly this path is the speech service's right; it has no subgroup.
      - name: speech-service
clientScopes:
  - name: groups
    description: The user's groups as full paths, for example /apps/songmaker
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          claim.name: groups
          full.path: "true"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
  - name: agent-service-audience
    description: Adds agent-service to the access token audience
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: agent-service-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: agent-service
          id.token.claim: "false"
          access.token.claim: "true"
          # Stated, because Keycloak would otherwise default it on create and the next apply flip it.
          userinfo.token.claim: "false"
          introspection.token.claim: "true"
  - name: speech-service-audience
    description: Adds speech-service to the access token audience
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: speech-service-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: speech-service
          id.token.claim: "false"
          access.token.claim: "true"
          userinfo.token.claim: "false"
          introspection.token.claim: "true"
# Every new account is asked once to accept the terms of use (docs/keycloak.md, "Terms of use").
# `priority` is stated because config-cli writes 0 for a missing one. Deleting this block does not
# switch the action off (IMPORT_MANAGED_REQUIREDACTION is no-delete in compose.yaml): set `enabled: false`.
requiredActions:
  - alias: TERMS_AND_CONDITIONS
    providerId: TERMS_AND_CONDITIONS
    name: Terms and Conditions
    enabled: true
    defaultAction: true
    priority: 20
# Only the service accounts of the clients that call the agent service (A1d, #183) or the speech service
# are users here, and only to hold their workload roles; no person is ever listed, and no group.
users:
  - username: service-account-songmaker
    enabled: true
    serviceAccountClientId: songmaker
    realmRoles:
      - agent-workload
  - username: service-account-presentator
    enabled: true
    serviceAccountClientId: presentator
    realmRoles:
      - agent-workload
  - username: service-account-hopin
    enabled: true
    serviceAccountClientId: hopin
    realmRoles:
      - agent-workload
      - speech-workload
clients:
  # Audience only: the agent service accepts tokens issued for it and never signs anyone in.
  - clientId: agent-service
    name: agent-service
    enabled: true
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
  # Audience only, like agent-service: the speech service accepts tokens issued for it.
  - clientId: speech-service
    name: speech-service
    enabled: true
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
  # songmaker signs people in with the authorization code and PKCE. Only it also allows the device
  # grant, for the live smoke's sign-in; a device request needs its client secret. A sign-out in Keycloak calls
  # songmaker's back-channel logout over the internal network hal_backchannel_songmaker. songmaker
  # ignores the session id and ends every session of the person, so the call does not require one.
  # Its service account is the workload identity for the agent service (the token's azp must equal
  # the people's); the same holds for presentator and hopin.
  - clientId: songmaker
    name: songmaker
    enabled: true
    publicClient: false
    secret: $(env:SONGMAKER_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    frontchannelLogout: false
    baseUrl: "https://songmaker.hallucinai.de/"
    alwaysDisplayInConsole: false
    redirectUris:
      - "https://songmaker.hallucinai.de/auth/callback"
    attributes:
      post.logout.redirect.uris: "https://songmaker.hallucinai.de/login"
      pkce.code.challenge.method: "S256"
      backchannel.logout.url: "http://songmaker.hallucinai.de:8080/auth/backchannel-logout"
      backchannel.logout.session.required: "false"
      oauth2.device.authorization.grant.enabled: "true"
    defaultClientScopes: &songmaker_presentator_scopes
      - basic
      - profile
      - email
      - roles
      - web-origins
      - acr
      - service_account
      - groups
      - agent-service-audience
    optionalClientScopes: []
  # hopin signs people in the same way as songmaker and is logged out the same way (#254). It holds
  # a refresh token per session, named as on so a merge cannot keep an earlier off, and its service
  # account is a workload of the agent service and of the speech service, whose audience it asks for by
  # the optional scope speech-service-audience. It reads no email, web origin or acr, so it has
  # none of those scopes.
  - clientId: hopin
    name: hopin
    enabled: true
    publicClient: false
    secret: $(env:HOPIN_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    frontchannelLogout: false
    baseUrl: "https://hopin.hallucinai.de/"
    alwaysDisplayInConsole: false
    redirectUris:
      - "https://hopin.hallucinai.de/auth/callback"
    attributes:
      post.logout.redirect.uris: "https://hopin.hallucinai.de/login"
      pkce.code.challenge.method: "S256"
      backchannel.logout.url: "http://hopin.hallucinai.de:8080/auth/backchannel-logout"
      backchannel.logout.session.required: "false"
      use.refresh.tokens: "true"
    defaultClientScopes:
      - basic
      - profile
      - groups
      - roles
      - service_account
      - agent-service-audience
    optionalClientScopes:
      - speech-service-audience
  # One client for presentator's two hosts (agent-presentator#242). It is logged out like hopin, on
  # presentator's own port, over its own back-channel network.
  - clientId: presentator
    name: presentator
    enabled: true
    publicClient: false
    secret: $(env:PRESENTATOR_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    frontchannelLogout: false
    baseUrl: "https://presentator.hallucinai.de/"
    alwaysDisplayInConsole: false
    redirectUris:
      - "https://presentator.hallucinai.de/auth/callback"
      - "https://presentator-talk.hallucinai.de/auth/callback"
    attributes:
      post.logout.redirect.uris: "https://presentator.hallucinai.de/login"
      pkce.code.challenge.method: "S256"
      backchannel.logout.url: "http://presentator.hallucinai.de:8000/auth/backchannel-logout"
      backchannel.logout.session.required: "false"
    defaultClientScopes: *songmaker_presentator_scopes
    optionalClientScopes: []
